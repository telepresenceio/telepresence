$schema: https://json-schema.org/draft/2020-12/schema
$id: https://telepresence.io/schemas/workstation-state.v1alpha1.yaml
title: Telepresence workstation state
description: |-
  Declarative description of the Telepresence state on a workstation: an
  optional connection and a set of attachments (intercept, replace, ingest,
  or wiretap). The manifest is consumed by "telepresence apply -f" to bring
  the workstation to the described state, and by "telepresence delete -f" to
  tear that state down.

  A manifest without a connection requires an already established connection,
  and "telepresence delete -f" will then leave that connection intact. Only a
  manifest that declares the connection will disconnect during delete.

  Docker mode is deliberately out of scope; that form of state is captured
  using an annotated Docker Compose specification.
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
anyOf:
  - required: [connection]
  - required: [attachments]
properties:
  apiVersion:
    const: telepresence.io/v1alpha1
  kind:
    const: WorkstationState
  connection:
    $ref: '#/$defs/Connection'
  attachments:
    description: >-
      Attachments established (in order) by apply and removed (in reverse
      order) by delete. Attachment names must be unique within the manifest.
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/Attachment'

$defs:
  Connection:
    description: >-
      The Telepresence connection, corresponding to the flags of
      "telepresence connect".
    type: object
    additionalProperties: false
    properties:
      name:
        description: Name of the connection. Defaults to a name derived from the Kubernetes context and namespace.
        type: string
      kubeconfig:
        description: Path to the kubeconfig file to use.
        type: string
      context:
        description: Name of the kubeconfig context to use.
        type: string
      namespace:
        description: The Kubernetes namespace scope for the connection.
        type: string
      kubeFlags:
        description: >-
          Additional Kubernetes flags, keyed by flag name without the leading
          dashes (e.g. server, token, as, insecure-skip-tls-verify), with the
          flag argument as the value.
        type: object
        additionalProperties:
          type: string
      managerNamespace:
        description: The namespace where the traffic manager is to be found.
        type: string
      mappedNamespaces:
        description: >-
          Namespaces considered by the DNS resolver and NAT for outbound
          connections. Defaults to all namespaces.
        type: array
        minItems: 1
        items:
          type: string
      alsoProxy:
        description: Additional subnets to proxy.
        type: array
        items:
          $ref: '#/$defs/CIDR'
      neverProxy:
        description: Subnets to never proxy.
        type: array
        items:
          $ref: '#/$defs/CIDR'
      allowConflictingSubnets:
        description: Subnets that are allowed to conflict with local subnets.
        type: array
        items:
          $ref: '#/$defs/CIDR'
      proxyVia:
        description: >-
          Subnets translated using virtual IPs and routed via a workload. Use
          the workload "local" for plain virtual network address translation
          (the equivalent of the --vnat flag).
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - subnet
            - workload
          properties:
            subnet:
              $ref: '#/$defs/SymbolicSubnet'
            workload:
              type: string
      rerouteLocal:
        description: >-
          Ports on the local host rerouted to a remote host. Format is
          <local port>:<host>:<port>[/{tcp,udp}]. <port> can be symbolic when
          <host> is a service name.
        type: array
        items:
          type: string
      rerouteRemote:
        description: >-
          Ports rerouted on a remote host. Format is
          <host>:<port>:<new port>[/{tcp,udp}]. <port> can be symbolic when
          <host> is a service name.
        type: array
        items:
          type: string

  Attachment:
    oneOf:
      - $ref: '#/$defs/Intercept'
      - $ref: '#/$defs/Replace'
      - $ref: '#/$defs/Ingest'
      - $ref: '#/$defs/Wiretap'

  AttachmentCommon:
    type: object
    required:
      - type
      - name
    properties:
      type:
        enum:
          - intercept
          - replace
          - ingest
          - wiretap
      name:
        description: Name of the attachment.
        type: string
      namespace:
        description: Namespace of the workload. Defaults to the namespace of the connection.
        type: string
      container:
        description: >-
          Name of the container that provides the environment and mounts.
          Defaults to the container matching the first port.
        type: string
      env:
        $ref: '#/$defs/Env'
      mount:
        $ref: '#/$defs/Mount'
      nodeAgent:
        description: Use a node-scoped traffic agent.
        type: boolean

  InterceptCommon:
    description: Properties shared by intercept and wiretap attachments.
    type: object
    properties:
      workload:
        description: Name of the workload to attach to. Defaults to the attachment name.
        type: string
      service:
        description: >-
          Name of the service to attach to. Sometimes needed to uniquely
          identify the port.
        type: string
      ports:
        description: >-
          Local ports to forward to. Use <local port>:<identifier> to uniquely
          identify service ports, where <identifier> is the port name or
          number.
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/PortIdentifier'
      address:
        description: Local IP address to forward to. Defaults to 127.0.0.1.
        type: string
      mechanism:
        description: The mechanism used by the attachment.
        type: string
        default: tcp
      httpHeaders:
        description: >-
          Only handle HTTP requests that match all given HTTP headers. Format
          is <name>=<regex>.
        type: array
        items:
          type: string
      httpPathEqualities:
        description: Only handle HTTP requests with a path exactly equal to one of the given paths.
        type: array
        items:
          type: string
      httpPathPrefixes:
        description: Only handle HTTP requests with a path matching one of the given prefixes.
        type: array
        items:
          type: string
      httpPathRegexps:
        description: Only handle HTTP requests with a path matching one of the given regular expressions.
        type: array
        items:
          type: string
      plaintext:
        description: Use plaintext format when communicating with the interceptor process on the local workstation.
        type: boolean

  Intercept:
    description: Intercept traffic destined for a port of a workload.
    allOf:
      - $ref: '#/$defs/AttachmentCommon'
      - $ref: '#/$defs/InterceptCommon'
    unevaluatedProperties: false
    properties:
      type:
        const: intercept
      metadata:
        description: >-
          Metadata to attach to the intercept. It can be retrieved using the
          Telepresence API server.
        type: object
        additionalProperties:
          type: string
      toPod:
        $ref: '#/$defs/ToPod'

  Wiretap:
    description: >-
      Receive a copy of the traffic destined for a port of a workload without
      disturbing the original flow.
    allOf:
      - $ref: '#/$defs/AttachmentCommon'
      - $ref: '#/$defs/InterceptCommon'
    unevaluatedProperties: false
    properties:
      type:
        const: wiretap

  Replace:
    description: Replace a container in a workload.
    allOf:
      - $ref: '#/$defs/AttachmentCommon'
    unevaluatedProperties: false
    properties:
      type:
        const: replace
      name:
        description: >-
          Name of the workload whose container is replaced. Use
          <workload>/<container> when the container property isn't used to
          name the container.
        type: string
      ports:
        description: >-
          Container ports to forward to the local workstation. Use
          <local port>:<container port> when the local port differs, or "all"
          for all container ports.
        type: array
        minItems: 1
        default: [all]
        items:
          $ref: '#/$defs/PortIdentifier'
      address:
        description: Local IP address to forward to. Defaults to 127.0.0.1.
        type: string
      toPod:
        $ref: '#/$defs/ToPod'

  Ingest:
    description: Ingest the environment and mounts of a container without routing any traffic.
    allOf:
      - $ref: '#/$defs/AttachmentCommon'
    unevaluatedProperties: false
    properties:
      type:
        const: ingest
      name:
        description: Name of the workload to ingest.
        type: string
      toPod:
        $ref: '#/$defs/ToPod'

  Env:
    description: Emission of the remote environment to files on the workstation.
    type: object
    additionalProperties: false
    properties:
      file:
        description: Emit the remote environment to this file, using the given syntax.
        type: string
      syntax:
        description: Syntax used for the environment file.
        enum:
          - docker
          - compose
          - sh
          - sh:export
          - csh
          - csh:export
          - ps
          - ps:export
          - cmd
          - json
        default: docker
      json:
        description: Emit the remote environment to this file as a JSON blob.
        type: string

  Mount:
    description: Mounting of the remote container's volumes on the workstation.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: Whether the remote volumes are mounted.
        type: boolean
        default: true
      path:
        description: >-
          Local mount point for the remote volumes. Defaults to a generated
          temporary directory.
        type: string
      readOnly:
        description: Mount the volumes read-only. Always true for an ingest.
        type: boolean
      localMountPort:
        description: >-
          Expose the remote file system on this local port using SFTP instead
          of mounting it.
        type: integer
        minimum: 1
        maximum: 65535

  ToPod:
    description: >-
      Additional ports to forward to the pod, made available on localhost. The
      default protocol is TCP. Use <port>/UDP for UDP ports.
    type: array
    items:
      type: string
      pattern: '^[1-9][0-9]{0,4}(/(tcp|udp|TCP|UDP))?$'

  PortIdentifier:
    description: A port number, a port name, or a <port>:<port or name> mapping.
    oneOf:
      - type: string
      - type: integer
        minimum: 1
        maximum: 65535

  CIDR:
    description: A subnet in CIDR notation.
    type: string
    pattern: '^[0-9a-fA-F.:]+/[0-9]{1,3}$'

  SymbolicSubnet:
    description: >-
      A subnet in CIDR notation, or one of the symbolic names "service",
      "pods", "also", or "all".
    oneOf:
      - $ref: '#/$defs/CIDR'
      - enum:
          - service
          - pods
          - also
          - all

{{- if not .NoService }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .SvcName }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .Name }}
spec:
{{- if .Headless }}
  clusterIP: None
{{- end }}
  selector:
    app: {{ .Name }}
  ports:
    - name: http
      port: {{ .Port }}
      targetPort: http
{{- range .ExtraPorts }}
    - name: {{ .Name }}
      port: {{ .Port }}
      targetPort: {{ .Name }}
{{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .Name }}
spec:
  replicas: {{ .Replicas }}
  selector:
    matchLabels:
      app: {{ .Name }}
  template:
    metadata:
      labels:
        app: {{ .Name }}
{{- if .Annotations }}
      annotations:
{{- range $k, $v := .Annotations }}
        {{ $k }}: "{{ $v }}"
{{- end }}
{{- end }}
    spec:
      containers:
        - name: {{ .Name }}
          image: {{ .Image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Port }}
{{- range .ExtraPorts }}
            - name: {{ .Name }}
              containerPort: {{ .Port }}
{{- end }}
{{- if .ExtraPorts }}
          env:
            - name: PORTS
              value: "{{ .PortsEnv }}"
{{- end }}

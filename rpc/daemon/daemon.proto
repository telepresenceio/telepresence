syntax = "proto3";
package telepresence.daemon;

import "common/version.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "manager/manager.proto";

option go_package = "github.com/telepresenceio/telepresence/rpc/v2/daemon";

// The Daemon service is responsible for managing network overrides and also
// acts as the central point for logging.
service Daemon {
  // Version returns version information from the Daemon
  rpc Version(google.protobuf.Empty) returns (telepresence.common.VersionInfo);

  // Status returns the current connectivity status
  rpc Status(google.protobuf.Empty) returns (DaemonStatus);

  // Quit quits (terminates) the service.
  rpc Quit(google.protobuf.Empty) returns (QuitResponse);

  // Connect creates a new session that provides outbound connectivity to the cluster
  rpc Connect(NetworkConfig) returns (DaemonStatus);

  // Disconnect disconnects the current session.
  rpc Disconnect(google.protobuf.Empty) returns (google.protobuf.Empty);

  // GetNetworkConfig returns the current network configuration
  rpc GetNetworkConfig(google.protobuf.Empty) returns (NetworkConfig);

  // SetDNSTopLevelDomains sets a new search path.
  rpc SetDNSTopLevelDomains(Domains) returns (google.protobuf.Empty);

  // SetDNSExcludes sets the excludes field of DNSConfig.
  rpc SetDNSExcludes(SetDNSExcludesRequest) returns (google.protobuf.Empty);

  // SetDNSMappings sets the Mappings field of DNSConfig.
  rpc SetDNSMappings(SetDNSMappingsRequest) returns (google.protobuf.Empty);

  // SetLogLevel will temporarily set the log-level for the daemon for a duration that is determined b the request.
  rpc SetLogLevel(manager.LogLevelRequest) returns (google.protobuf.Empty);

  // TranslateEnvIPs translates remote IPs found in the environment to local IPs
  rpc TranslateEnvIPs(Environment) returns (Environment);

  // WaitForNetwork waits for the network of the currently connected session to become ready.
  rpc WaitForNetwork(google.protobuf.Empty) returns (google.protobuf.Empty);

  // WaitForAgentIP waits for the network of an intercepted agent to become ready.
  rpc WaitForAgentIP(WaitForAgentIPRequest) returns (WaitForAgentIPResponse);

  // LookupIP resolves the given name using the Telepresence DNS server
  rpc LookupIP(LookupIPRequest) returns (LookupIPResponse);

  // ResolvePort resolves an hostName:portID string from into a netip.AddrPort
  rpc ResolvePort(ResolvePortRequest) returns (ResolvePortResponse);

  // RerouteRemotePort makes a netip.AddrPort available on a new port on the same address.
  rpc RerouteRemotePort(ReroutePortRequest) returns (google.protobuf.Empty);

  // SetInterceptShortcuts declares cluster-side destinations that the root daemon
  // connects directly to local intercept handlers instead of tunneling to the cluster.
  // Each call replaces the previously declared set.
  rpc SetInterceptShortcuts(SetInterceptShortcutsRequest) returns (google.protobuf.Empty);

  // AddLocalClientRedirect redirects traffic for a netip.AddrPort to localhost on a different port.
  rpc AddLocalClientRedirect(ReroutePortRequest) returns (google.protobuf.Empty);

  // RemoveLocalClientRedirect stops redirecting traffic for a netip.AddrPort to localhost.
  rpc RemoveLocalClientRedirect(ReroutePortRequest) returns (google.protobuf.Empty);

  // ListLocalClientRedirects lists active local client redirects.
  rpc ListLocalClientRedirects(google.protobuf.Empty) returns (LocalClientRedirects);

  rpc ActivityWatcher(google.protobuf.Empty) returns (stream Activity);

  // WatchAgentPods is called by the user daemon to push the agent-pod
  // projection it derives from its combined traffic-manager watcher. It is
  // only used when the NetworkConfig passed to Connect has a non-empty
  // agent_pod_namespaces, which tells this daemon not to watch agent pods
  // itself.
  rpc WatchAgentPods(stream AgentPodsDelta) returns (google.protobuf.Empty);
}

message DaemonStatus {
  bool managed = 2;
  NetworkConfig outbound_config = 4;
  telepresence.common.VersionInfo version = 5;

  // tunnel_transport reports which transport currently serves manager-bound
  // tunnel streams. Absent when there is no active session (an old root
  // daemon that predates this field is indistinguishable from that case).
  TunnelTransport tunnel_transport = 6;

  // agent_transports reports which transport currently carries the live
  // connection to each connected traffic-agent pod. Empty unless at least one
  // agent connection is up; an old root daemon that predates this field is
  // indistinguishable from that case, so callers must treat both as "omit".
  repeated AgentTransport agent_transports = 7;
  reserved 3;
}

// TunnelTransport reports which transport currently serves manager-bound
// tunnel streams for the connected session.
message TunnelTransport {
  // "grpc", "quic", or "grpc (fallback)".
  string transport = 1;

  // The remote QUIC endpoint address. Only set when transport is "quic".
  string endpoint = 2;
}

// AgentTransport reports which transport currently carries the live
// connection to one traffic-agent pod.
message AgentTransport {
  // The workload that the agent pod belongs to.
  string workload = 1;

  // The name of the agent pod.
  string pod = 2;

  // "quic" or "grpc" (the port-forwarded transport).
  string transport = 3;
}

message Domains {
  repeated string domains = 1;
}

message DNSMapping {
  string name = 1;
  string alias_for = 2;
}

// DNS configuration for the local DNS resolver
message DNSConfig {
  // local_address is the address and port of the local DNS server.
  // In netip.AddrPort binary form.
  repeated bytes local_addresses = 1;

  // vif_address is the address and port that the DNS server uses on the Telepresence VIF. Only used by Linux systems.
  // In netip.AddrPort binary form.
  bytes vif_address = 2;

  // Suffixes to exclude
  repeated string exclude_suffixes = 3;

  // Suffixes to include. Has higher prio than the excludes
  repeated string include_suffixes = 4;

  // Exclude are a list of hostname that the DNS resolver will not resolve even if they exist.
  repeated string excludes = 8;

  // DNSMapping contains a hostname and its associated alias. When requesting the name, the intended behavior is
  // to resolve the alias instead.
  repeated DNSMapping mappings = 9;

  // The maximum time wait for a cluster side host lookup.
  google.protobuf.Duration lookup_timeout = 6;

  // Perform a recursion check on first connect.
  bool recursion_check = 5;

  // If set, this error indicates why DNS is not working.
  string error = 7;
}

message SubnetViaWorkload {
  // The remote IP that the DNS resolver translates into a Virtual IP to use locally.
  string subnet = 1;

  // The workload that the virtual IP will be routed to.
  string workload = 2;
}

// NetworkConfig contains all information that the root daemon needs in order to
// establish outbound traffic to the cluster.
message NetworkConfig {
  // session makes it possible for the root daemon to identify itself as the
  // same client as the user daemon.
  manager.SessionInfo session = 1;

  // Route subnets via given workload using virtual IPs
  repeated SubnetViaWorkload subnet_via_workloads = 2;

  // Port mappings enforced by the TUN-device.
  repeated string port_mappings = 8;

  // Users home directory
  string home_dir = 3;

  // Connection namespace
  string namespace = 4;

  // Namespace where the connected traffic-manager is installed.
  string manager_namespace = 9;

  // Mapped namespaces
  repeated string mapped_namespaces = 10;

  // Kubernetes flags
  map<string, string> kube_flags = 5;

  // Kubeconfig YAML, if not to be loaded from file.
  optional bytes kubeconfig_data = 6;

  // The completely merged client Config, unless daemon runs embedded
  optional bytes client_config = 7;

  // Namespaces in which the user daemon relays agent-pod events using
  // WatchAgentPods. When non-empty, this daemon must not watch agent pods
  // itself.
  repeated string agent_pod_namespaces = 11;
}

// AgentPodsDelta is pushed by the user daemon, carrying the agent-pod
// projection it derives from its combined traffic-manager watcher.
message AgentPodsDelta {
  // When true, discard all previously received agent-pod state before
  // applying the upserts/removals in this message. Set on the first message
  // of every relay stream and whenever the user daemon's traffic-manager
  // watcher has been re-established.
  bool reset = 1;
  map<string, manager.AgentPodInfo> upserts = 2;
  repeated string removals = 3;
}

message SetDNSExcludesRequest {
  repeated string excludes = 1;
}

message SetDNSMappingsRequest {
  repeated DNSMapping mappings = 1;
}

message WaitForAgentIPRequest {
  bytes ip = 1;
  google.protobuf.Duration timeout = 2;
  string namespace = 3;
}

message WaitForAgentIPResponse {
  // The local IP of the agent (might be virtual)
  bytes local_ip = 1;
}

message LookupIPRequest {
  string name = 1;
}

message LookupIPResponse {
  // IP in netip.Addr binary form
  bytes ip = 1;
}

message Environment {
  map<string, string> env = 1;
}

message ResolvePortRequest {
  // host is the name or IP-address of the targeted host.
  string host = 1;

  // port can be symbolic if the host is the name of a service, and can be suffixed with /{tcp|udp}.
  string port = 2;
}

message ResolvePortResponse {
  // host_port is a iputil.ProtoAddrPort in binary format
  bytes host_port = 1;
}

message ReroutePortRequest {
  // host_port is a iputil.ProtoAddrPort in binary format
  bytes dst_host_port = 1;

  // port is will be rerouted to the host_port.
  uint32 src_port = 2;
}

// InterceptShortcut declares that connections to the cluster-side destinations of an
// intercepted workload can be served directly by the local intercept handler.
message InterceptShortcut {
  // The namespace of the intercepted workload.
  string namespace = 1;

  // The name of the intercepted workload.
  string workload = 2;

  // The protocol, "TCP" or "UDP".
  string protocol = 3;

  // Cluster-side service addresses, each in netip.AddrPort binary form.
  repeated bytes service_addrs = 4;

  // The container port that the intercept covers. Matched against the pod IPs
  // of the workload's traffic-agent pods.
  uint32 container_port = 5;

  // The local intercept handler, in netip.AddrPort binary form.
  bytes target = 6;
}

message SetInterceptShortcutsRequest {
  repeated InterceptShortcut shortcuts = 1;
}

message LocalClientRedirect {
  // host_port is a iputil.ProtoAddrPort in binary format
  bytes dst_host_port = 1;

  // local_port is the port on localhost that traffic is redirected to.
  uint32 local_port = 2;
}

message LocalClientRedirects {
  repeated LocalClientRedirect redirects = 1;
}

message QuitResponse {
  // Set to true when the root daemon runs as a service.
  bool root_daemon_will_continue = 1;
}

message Activity {
  google.protobuf.Timestamp activity = 1;

  // session_end is true when this is the final Activity message emitted
  // before the root daemon's session terminates. The metrics fields below
  // are only meaningful on such terminal messages; intermediate liveness
  // pings leave them at zero.
  bool session_end = 2;

  // session_duration is how long the session was active, set on the
  // terminal message only.
  google.protobuf.Duration session_duration = 3;

  // outbound_tunnels counts the number of outbound tunnels the root daemon
  // established during the session (one per accepted local connection that
  // was streamed to the cluster). DNS pipes are not counted.
  int64 outbound_tunnels = 4;

  // outbound_tunnel_errors counts attempts that failed to establish an
  // outbound tunnel (manager dial failure, agent unreachable, recursive
  // VIF dispatch, etc).
  int64 outbound_tunnel_errors = 5;

  // incoming_dials counts dial requests received by the dial watchers from
  // traffic-agents during intercepts (one per WatchDial frame).
  int64 incoming_dials = 6;

  // incoming_dial_errors counts incoming dials that could not be served
  // (manager tunnel open failure, stream creation failure, etc).
  int64 incoming_dial_errors = 7;
}

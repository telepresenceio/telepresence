syntax = "proto3";

// The "manager" package describes the server implemented by the
// in-cluster Manager, which is spoken to by the Agent (app-sidecar),
// the on-laptop Connector (user-daemon), and the on-laptop CLI.
package telepresence.manager;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/telepresenceio/telepresence/rpc/v2/manager";

// ClientInfo is the self-reported metadata that the on-laptop
// Telepresence client reports whenever it connects to the in-cluster
// Manager.
message ClientInfo {
  string name = 1;  // user@hostname
  string namespace = 6; // namespace that the client is connected to
  string install_id = 2;
  string product = 3;  // "telepresence"
  string version = 4;

  reserved 5; // was api_key
}

// AgentInfo is the self-reported metadata that an Agent (app-sidecar)
// reports at boot-up when it connects to the Telepresence Manager.
message AgentInfo {
  string name = 1;      // name of the Workload
  string kind = 13;
  string namespace = 7; // namespace of the Workload
  string pod_name = 8;  // Pod name (from metadata.name)
  string pod_ip = 2;    // Pod IP (from status.podIP)
  string pod_uid = 14;  // Pod UID
  int32 api_port = 9;   // Port number for the agent gRPC API
  int32 sftp_port = 10; // Port number for the agent SFTP server
  int32 ftp_port = 11;  // Port number for the agent FTP server
  string product = 3;   // distinguish open source, our closed source, someone else's thing
  string version = 4;

  // "Mechanisms" are the ways that an Agent can decide handle
  // incoming requests, and decide whether to send them to the
  // in-cluster service, or whether to intercept them.  The "tcp"
  // mechanism is the only one in Telepresence open source, and
  // handles things at the TCP-level and either intercepts all TCP
  // streams or doesn't intercept anything.  Other Agents than the
  // Telepresence one may implement more mechanisms, such as
  // Ambassador Labs' "Service Preview" Agent which implements the
  // "http" mechanism which handles th "http" mechanism, which handles
  // things at the HTTP-request-level and can decide to intercept
  // individual HTTP requests based on the request headers.
  message Mechanism {
    string name = 1; // "tcp" or "http" or "grpc" or ...
    string product = 2; // distinguish open source, our closed source, someone else's thing
    string version = 3;
  }

  // This is a list of the mechanisms that the Agent advertises that
  // it supports.
  repeated Mechanism mechanisms = 5;

  message ContainerInfo {
    // The container environment
    map<string, string> environment = 1;

    // The directory where the intercept mounts can be found in the agent
    string mount_point = 4;

    // Map of mount -> MountPolicy
    map<string, int32> mounts = 13;
  }
  map<string,ContainerInfo> containers = 12;

  // True when the agent is node-hosted: a Job in the traffic-manager's
  // namespace that enters the target pod's namespaces, rather than a
  // sidecar running in the workload's own pods.
  bool node_agent = 15;

  // UDP port of this agent's QUIC listener, reachable only through the QUIC
  // forwarder (see docs/reference/quic-transport-architecture.md, "Agent connections
  // over QUIC"). 0 means this agent has no QUIC listener.
  int32 quic_port = 16;

  // InterceptTarget describes one service-backed target that this agent can
  // handle. The traffic-manager uses these claims when a single Service
  // selects pods owned by more than one workload.
  message InterceptTarget {
    // .metadata.uid of the Service associated with the target.
    string service_uid = 1;

    // Name of the Service, retained for diagnostics.
    string service_name = 2;

    // Name and number of the selected Service port.
    string service_port_name = 3;
    int32 service_port = 4;

    // Protocol and local container target used by this agent.
    string protocol = 5;
    string container_name = 6;
    int32 container_port = 7;
  }

  // Service-backed targets advertised by this agent. Older agents leave this
  // empty and continue to use workload-scoped intercept matching.
  repeated InterceptTarget intercept_targets = 17;

  reserved 6;
}

// PortMapping describes a mapping from a port number in the intercepted container to
// a port on the client for --from-pod and or vice versa when using --to-pod.
message PortMapping {
  int32 from = 1;
  int32 to = 2;
}

// InterceptSpec contains static information about an intercept. It is shared by
// all running agent instances.
message InterceptSpec {
  // A human-friendly name for this intercept.  This is usually the
  // same as the agent name below; the name/namespace of the
  // Workload, but it could be something else.  It is invalid for
  // the same client to attempt to create multiple intercepts with the
  // same name.
  string name = 1;

  // Same as ClientInfo.Name; "user@hostname".
  string client = 2;

  // Same as AgentInfo.Name of the Workload.
  string agent = 3;

  // Kind of the Workload
  string workload_kind = 13;

  // Same as AgentInfo.Namespace of the Workload
  string namespace = 8;

  // How to decide which subset of requests to that agent to intercept.
  string mechanism = 4;

  // The host that the target_ports are routed to.
  string target_host = 6;

  // Ports that will be forwarded from the intercepting pod's IP address
  // to the target_host, using the following syntax:
  //
  // PORT = port-decl ["/" protocol ]
  // port-decl = port-spec [ ":" uint16 ]
  // protocol = "TCP" | "UDP"
  // port-spec = name | uint16
  //
  // If two numbers are used, they signify source:destination.
  repeated string pod_ports = 5;

  // Ports that will be forwarded from the intercepting client's localhost
  // to the intercepted pod. Uses the same syntax as target_ports.
  repeated string local_ports = 18;

  // Identifier for the service or container port: either the name or port number
  // optionally followed by a "/TCP" or "/UDP"
  string port_identifier = 10;

  // The resolved service port name
  string service_port_name = 19;

  // The resolved service port
  int32 service_port = 20;

  // .uid.metadata of service associated with intercept
  string service_uid = 12;

  // name of the aforementioned service
  string service_name = 14;

  // The resolved protocol used by the container port
  string protocol = 21; // TCP or UDP

  // Name of container that provides environment and mounts. This is normally the container
  // that owns the container_port, but in some cases it will differ because the container_port
  // is owned by some kind of routing mechanism (such as nginx).
  string container_name = 24;

  // The resolved container port that is intercepted.
  int32 container_port = 23;

  // The port on the workstation that the intercepted container_port is redirected to.
  int32 target_port = 7;

  // The delay imposed by a call roundtrip between the traffic-agent and
  // the client on the workstation. This delay is added to the dial_timeout
  // when the workstation performs a dial on behalf of the traffic-agent.
  int64 roundtrip_latency = 16;

  // The dial timeout to use when a dial is made on the intercepting workstation.
  int64 dial_timeout = 17;

  // Extra ports that will be forwarded from the intercepting client's localhost
  // to the intercepted pod.
  // Deprecated: use local_ports instead
  repeated int32 extra_ports = 15;

  // Whether to replace the running container.
  bool replace = 22;

  // place a wiretap on intercepted ports instead of redirecting them
  bool wiretap = 26;

  // Intercept desire no default port.
  bool no_default_port = 25;

  // HTTP header filters for HTTP Intercepts. Only requests containing
  // these headers (key=value) will be intercepted. Multiple headers use AND logic.
  map<string,string> header_filters = 27;

  // Path filter patterns for HTTP Intercepts. Supports glob patterns like "/api/v1/*".
  // If specified, only requests matching these paths will be intercepted.
  repeated string path_filters = 28;

  // Metadata to associate with the intercept. Retrievable using the API server.
  map<string,string> metadata = 29;

  // Plaintext instructs the traffic-agent to use plain text when communicating with the client.
  bool plaintext = 30;

  // The cluster IPs of the service that the intercept is made on, each in
  // netip.Addr binary form.
  repeated bytes service_ips = 31;

  // Request that this intercept be served by a node-hosted traffic-agent
  // (a manager-created Job that enters the target pod's namespaces) rather
  // than by a sidecar injected into the workload. Requires the
  // traffic-manager to have node-agent mode enabled.
  bool node_agent = 32;

  reserved 9; // used to be former mechanism_args

  // Used to be mount_point and only utilized when passing the spec between
  // the user daemon and the CLI. It's now moved to InterceptInfo
  reserved 11;
}

enum InterceptDispositionType {
  UNSPECIFIED = 0;

  ACTIVE = 1;
  WAITING = 2;
  REMOVED = 9;

  // Failure states

  // What does "NO_CLIENT" mean?  The Manager garbage-collects the
  // intercept if the client goes away.
  NO_CLIENT = 3;

  // NO_AGENT indicates that there are no currently-running agents
  // that can service the intercept, or that there is a inconsistency
  // between the agents that are running.  This may be an ephemeral
  // state, such as inconsistency between agents during the middle of
  // a rolling update.
  NO_AGENT = 4;

  // NO_MECHANISM indicates that the agent(s) that would handle this
  // intercept do not report that they support the mechanism of the
  // intercept.  For example, if you are running the OSS agent but ask
  // for an intercept using the "http" mechanism, which requires the
  // Ambassador Telepresence agent.
  NO_MECHANISM = 5;

  // NO_PORT indicates that the manager was unable to allocate a port
  // to act as the rendezvous point between the client and the agent.
  NO_PORTS = 6;

  // AGENT_ERROR indicates that the intercept was submitted to an
  // agent, but that the agent rejected it (by calling
  // ReviewIntercept).
  AGENT_ERROR = 7;

  // BAD_ARGS indicates that something about the mechanism_args is
  // invalid.
  BAD_ARGS = 8;
}

// InterceptWorkload identifies one workload whose pods participate in a
// Service-scoped intercept.
message InterceptWorkload {
  string namespace = 1;
  string workload_kind = 2;
  string workload_name = 3;
}

// InterceptInfo contains information about a live intercept in an agent
message InterceptInfo {
  InterceptSpec spec = 1;

  string id = 5;
  SessionInfo client_session = 6;

  // The current intercept state; a status code and a human-friendly
  // message to go along with the status code.  These may be set
  // manager itself, or may be set by the agent's call to
  // ReviewIntercept.
  InterceptDispositionType disposition = 3;
  string message = 4;

  // Name and port to use when establishing port-forward to the pod's
  // gRPC API.
  string pod_name = 19;
  int32 api_port = 20;

  string pod_ip = 10;
  int32 sftp_port = 11;
  int32 ftp_port = 18;

  // The directory where the client mounts the remote mount_point. Only
  // set when obtaining InterceptInfo from the user daemon.
  string client_mount_point = 2;

  // The directory where the intercept mounts can be found in the agent
  string mount_point = 16;

  // A human-friendly description of what the spec.mechanism_args say.
  // This is set by the agent's call to ReviewIntercept.
  string mechanism_args_desc = 12;

  // The environment of the intercepted app
  map<string, string> environment = 17;

  // Map of mount path -> MountPolicy
  map<string, int32> mounts = 22;

  // Timestamp for last modification made by traffic-manager
  google.protobuf.Timestamp modified_at = 21;

  // Workloads whose ready Service-selected pods participate in this intercept.
  // This is populated by the manager for Service-scoped intercepts so
  // server-side integrations can configure every participating workload.
  repeated InterceptWorkload service_workloads = 23;

  reserved 7; // was preview_domain

  reserved 9; // was PreviewSpec preview_spec

  reserved 13; // was api-key

  reserved 14; // was headers used by the API-server

  reserved 15; // was metadata used by the API-server
}

message ReconnectAgentRequest {
  SessionInfo session = 1;
  AgentInfo agent = 2;
}

message ReconnectClientRequest {
  SessionInfo session = 1;
  ClientInfo client = 2;
  repeated InterceptInfo intercepts = 3;
  repeated AgentInfo agents = 4;
}

message SessionInfo {
  string session_id = 1;
  string manager_install_id = 2;
  optional string install_id = 3;
}

message AgentsRequest {
  SessionInfo session = 1;
  repeated string namespaces = 2;
}

message AgentInfoSnapshot {
  repeated AgentInfo agents = 1;
}

message AgentInfoDelta {
  map<string,AgentInfo>  upserts = 1;
  repeated string removals = 2;
}

message InterceptInfoSnapshot {
  repeated InterceptInfo intercepts = 1;
}

message InterceptInfoDelta {
  map <string,InterceptInfo> upserts = 1;
  repeated string removals = 2;
}

// SessionEventsRequest identifies the watching session and scopes the agent
// portion of the WatchSessionEvents stream.
message SessionEventsRequest {
  SessionInfo session = 1;

  // Namespaces in which the client wants agent events in addition to the
  // session's connected namespace. This is the set of mapped namespaces that
  // the client is permitted to port-forward to.
  repeated string namespaces = 2;
}

// SessionEventsDelta multiplexes agent-pod and intercept deltas onto one
// stream. Either or both fields may be present in a single message.
//
// Container-level agent data (environments, mounts, ports) is deliberately
// not streamed; clients retrieve it on demand from the EnsureAgent response
// or from InterceptInfo.
message SessionEventsDelta {
  // Agent pods in the requested namespaces plus the session's connected
  // namespace. Same projection as the WatchAgentPodsInNamespacesDelta
  // stream, including the per-client intercepted flag.
  AgentPodInfoDelta agent_pods = 1;

  // The watching client's intercepts.
  InterceptInfoDelta intercepts = 2;
}

message CreateInterceptRequest {
  SessionInfo session = 1;
  InterceptSpec intercept_spec = 2;
  reserved 3; // was api_key;
}

message EnsureAgentRequest {
  SessionInfo session = 1;
  string name = 2;
  string namespace = 3;

  // Request that this agent be served by a node-hosted traffic-agent
  // (a manager-created Job that enters the target pod's namespaces) rather
  // than by a sidecar injected into the workload. Requires the
  // traffic-manager to have node-agent mode enabled.
  bool node_agent = 4;
}

message ReleaseAgentRequest {
  SessionInfo session = 1;
  string name = 2;
  string namespace = 3;
}

message PreparedIntercept {
  string error = 1;
  int32 error_category = 2;

  string namespace = 3;
  string service_uid = 4;
  string service_name = 5;
  string service_port_name = 6;
  int32 service_port = 7;
  string workload_kind = 8;
  string agent_image = 9;
  string protocol = 10; // TCP or UDP
  string container_name = 11;
  int32 container_port = 12;
  repeated string pod_ports = 13;

  // The cluster IPs of the service, each in netip.Addr binary form.
  repeated bytes service_ips = 14;
}

message RemoveInterceptRequest2 {
  SessionInfo session = 1;
  string name = 2;
}

message GetInterceptRequest {
  SessionInfo session = 1;
  string name = 2;
}

message ReviewInterceptRequest {
  SessionInfo session = 1;
  string id = 2;
  InterceptDispositionType disposition = 3;
  string message = 4;

  // pod IP and sftp port to use when doing sshfs mounts
  string pod_ip = 5;
  int32 sftp_port = 6;
  int32 ftp_port = 12;

  // The directory where the intercept mounts can be found in the agent
  string mount_point = 10;

  // A human-friendly description of what the
  // InterceptSpec.mechanism_args say.
  string mechanism_args_desc = 7;

  // The environment of the intercepted container
  map<string, string> environment = 11;

  // Map of mount path -> MountPolicy of the attached container
  map<string, int32> mounts = 13;

  reserved 8; // was headers used by the workstation API-server

  reserved 9; // was metadata used by the workstation API-server
}

message RemainRequest {
  SessionInfo session = 1;
  google.protobuf.Timestamp last_activity = 3;
  reserved 2; // was api_key
}

message LogLevelRequest {
  string log_level = 1;

  // The time that this log-level will be in effect before
  // falling back to the configured log-level.
  google.protobuf.Duration duration = 2;

  // The session of the client requesting the change. Unset in requests
  // from older clients.
  SessionInfo session = 3;
}

// Deprecated.
message GetLogsRequest {
  // Whether or not logs from the traffic-manager are desired.
  bool traffic_manager = 1;

  // The traffic-agent(s) logs are desired from. Can be `all`, `False`,
  // or substring to filter based on pod names.
  string agents = 2;

  // Whether or not to get the pod yaml deployed to the cluster.
  bool get_pod_yaml = 3;
}

// Deprecated.
message LogsResponse {

  // The map contains assocations between <podName.namespace> and the logs
  // from that pod.
  map<string, string> pod_logs = 1;

  // Errors encountered when getting logs from the traffic-manager
  // and/or traffic-agents.
  string err_msg = 2;

  // The map contains assocations between <podName.namespace> and the pod's
  // yaml.
  map<string, string> pod_yaml = 3;
}

message TelepresenceAPIInfo {
  // The port that the TelepresenceAPI is using, or 0 if it's not enabled
  int32 port = 1;
}

// VersionInfo2 is different than telepresence.common.VersionInfo in
// that it is limited to just name and version.
message VersionInfo2 {
  string name = 1;
  string version = 2;

  // Whether the responding server authenticates bearer tokens presented in
  // gRPC metadata. Only the traffic-manager populates this.
  bool auth_supported = 3;

  // Whether the responding server rejects calls that carry no valid bearer
  // token. Only the traffic-manager populates this. Clients whose kubeconfig
  // credentials cannot produce a token should surface a clear error instead
  // of connecting.
  bool auth_required = 4;

  // Container port of the traffic-manager's x509 authentication listener, or
  // zero when disabled. A client whose kubeconfig credentials are a client
  // certificate can perform a TLS handshake against this port, presenting
  // that certificate, and receives a short-lived manager-issued bearer token
  // to use as per-RPC authorization metadata. Only the traffic-manager
  // populates this.
  uint32 auth_x509_port = 5;
}

// TunnelMessage is a message sent over a Tunnel. First byte indicates type of message
message TunnelMessage {
  bytes payload = 1;
}

// QuicTunnelEndpoint describes the traffic-manager's QUIC endpoint, if any, so that a
// client can dial it directly instead of tunneling over the port-forwarded connection.
message QuicTunnelEndpoint {
  // Whether the traffic-manager has a QUIC listener exposed. The remaining fields are
  // only meaningful when this is true.
  bool enabled = 1;

  // Externally reachable host or IP of the QUIC endpoint.
  string host = 2;

  // UDP port of the QUIC endpoint.
  int32 port = 3;

  // CA bundle (PEM) to verify the server certificate against.
  bytes ca_pem = 4;

  // Session-scoped client certificate (PEM) to present to the server.
  bytes client_cert_pem = 5;

  // Private key (PEM) for the client certificate.
  bytes client_key_pem = 6;

  // TLS server name to use when verifying the server certificate.
  string server_name = 7;

  // ALPN protocol to offer in the TLS handshake. An empty value means the
  // client's built-in default.
  string alpn = 8;

  // Candidate dialable addresses for the QUIC endpoint, ordered by the
  // traffic-manager's preference (see "Zero-configuration endpoint discovery" in
  // docs/reference/quic-transport-architecture.md). The client dials candidates
  // concurrently and keeps the first whose handshake completes. host/port above
  // always duplicate the first entry, if any, so an older client (built before
  // this field existed) still gets a single address to dial.
  repeated QuicEndpointCandidate candidates = 9;
}

// One dialable address for the QUIC endpoint. Candidates are ordered by the
// manager's preference; the client keeps the first that handshakes.
message QuicEndpointCandidate {
  string host = 1;
  int32 port = 2;
}

// SessionCredential is the response to GetSessionCredential: the session-scoped
// credential -- in both its certificate and bearer-token forms -- used to
// authenticate against a traffic-agent's file-sharing and gRPC ports. See
// "Traffic-agent ports" in docs/reference/authentication.md.
message SessionCredential {
  // CA bundle (PEM) that signed the client certificate and the token.
  bytes ca_pem = 1;

  // Client certificate (PEM) whose CommonName is the session ID.
  bytes client_cert_pem = 2;

  // Private key (PEM) for client_cert_pem.
  bytes client_key_pem = 3;

  // Signed bearer token naming the session; rides where a certificate
  // cannot (the FTP password, gRPC metadata).
  string token = 4;

  // Expiry shared by the certificate and the token.
  google.protobuf.Timestamp expiry = 5;
}

// QuicBackend identifies one live pod IP that the QUIC forwarder (a separate
// stateless packet router; see docs/reference/quic-transport-architecture.md) may
// route traffic to.
message QuicBackend {
  // Pod IP in netip.Addr binary form (4 or 16 bytes), the same encoding
  // AgentPodInfo.pod_ip uses.
  bytes ip = 1;

  // "manager" or "agent".
  string kind = 2;

  // UDP port of this backend's QUIC listener.
  int32 port = 3;

  // Pod UID of this backend, used by the forwarder to resolve an AgentSNI
  // (quicfwd.AgentSNI) to this entry. Empty for kind "manager".
  string pod_uid = 4;
}

// QuicBackendSnapshot is a full replacement snapshot of every pod IP the
// QUIC forwarder may route to. There is no delta variant: each snapshot
// replaces the previous one in its entirety, which keeps the forwarder
// simple and self-healing across a manager restart.
message QuicBackendSnapshot {
  repeated QuicBackend backends = 1;
}

message DialRequest {
  bytes conn_id = 1;
  int64 roundtrip_latency = 2;
  int64 dial_timeout = 3;
  reserved 4;
}

// QuicAgentCert is the response to GetQuicAgentCert: a server certificate,
// minted by the traffic-manager's QUIC CA for the caller agent's own SNI
// name, so the agent can run a QUIC listener behind the forwarder. See
// docs/reference/quic-transport-architecture.md, "Agent connections over QUIC".
message QuicAgentCert {
  // false only for a manager predating the unconditional CA (see NewService):
  // the CA is now always present, so the remaining fields are only absent when
  // talking to one of those older managers.
  bool enabled = 1;

  // Server certificate (PEM) for the agent's SNI name.
  bytes cert_pem = 2;

  // Private key (PEM) for cert_pem.
  bytes key_pem = 3;

  // CA bundle (PEM) the agent uses as ClientCAs, to verify client
  // certificates presented by connecting clients.
  bytes ca_pem = 4;

  // The SNI name the certificate was minted for (quicfwd.AgentSNI(pod UID)).
  string sni = 5;

  // The manager's security.authentication.mode. Agents mirror it when deciding
  // whether to require the session credential (see "Traffic-agent ports" in
  // docs/reference/authentication.md).
  string authentication_mode = 6;
}

message LookupRequest {
  // Client session
  SessionInfo session = 1;

  // The name to use for the LookupIP request.
  string name = 2;
}

message LookupResponse {
  // List of found IPs in netip.Addr binary form.
  repeated bytes ips = 1;
}

// LookupHost request sent from a client
message DNSRequest {
  // Client session
  SessionInfo session = 1;
  string name = 2;
  uint32 type = 3;
}

message DNSResponse {
  // DNS return code
  int32 r_code = 1;

  // rrs is an array of packed RR records
  bytes rrs = 2;
}

message DNSAgentResponse {
  // Agent session
  SessionInfo session = 1;

  // DNSRequest is the request that this is a response to
  DNSRequest request = 2;

  // The response, which might be nil in case no address was found
  DNSResponse response = 3;
}

// IPNet is a subnet. e.g. 10.43.0.0/16
message IPNet {
  bytes ip = 1;
  int32 mask = 2;
}

// ClusterInfo contains information that the root daemon needs in order to
// establish outbound traffic to the cluster.
message ClusterInfo {
  // The service_cidrs reported by NetworkingV1().ServiceCIDRs() in netip.Prefix binary form.
  repeated bytes service_cidrs = 1;

  // service_subnet is the Kubernetes service subnet.
  // Deprecated: use service_cidrs
  IPNet service_subnet = 2;

  // pod_subnets are the subnets used for Kubenetes pods.
  repeated IPNet pod_subnets = 3;

  // manager_pod_ip is the ip address of the traffic manager
  bytes manager_pod_ip = 5;

  // manager_pod_port is the port of the traffic manager
  int32 manager_pod_port = 8;

  // injector_svc_ip is the ip address of the traffic manager's agent injector service
  bytes injector_svc_ip = 9;

  // injector_svc_port is the port of the traffic manager's agent injector service
  int32 injector_svc_port = 10;

  // injector_svc_host is the http host of the traffic manager's agent injector service
  string injector_svc_host = 11;

  // Router configuration
  Routing routing = 6;

  // DNS configuration
  DNS dns = 7;

  // cluster_domain is the domain of the cluster, ending with a dot, e.g. "cluster.local."
  // Deprecated: Use dns.cluster_domain
  reserved 4;
}

message Routing {
  repeated IPNet also_proxy_subnets = 1;
  repeated IPNet never_proxy_subnets = 2;
  repeated IPNet allow_conflicting_subnets = 3;
}

message DNS {
  repeated string include_suffixes = 1;
  repeated string exclude_suffixes = 2;

  // kube_dns_ip is the IP address of the kube-dns.kube-system service,
  // Deprecated: No longer used by clients >= 2.8.0
  bytes kube_ip = 3;

  // cluster_domain is the domain of the cluster, ending with a dot, e.g. "cluster.local."
  string cluster_domain = 4;
}

message CLIConfig {
  // config_yaml is a yaml blob containing the client config.
  bytes config_yaml = 1;
}

message AgentImageFQN {
  string f_q_n = 1;
}

message AgentPodInfo {
  string pod_id = 7;
  string pod_name = 1;
  string namespace = 2;
  bytes pod_ip = 3;
  int32 api_port = 4;
  bool intercepted = 5;
  string workload_name = 6;

  // True when the agent is node-hosted: a Job in the traffic-manager's
  // namespace that enters the target pod's namespaces, rather than a
  // sidecar running in the workload's own pods.
  bool node_agent = 8;

  // SNI name (quicfwd.AgentSNI(pod UID)) to dial, through the QUIC forwarder,
  // to reach this agent's QUIC listener. Empty means this agent has no QUIC
  // listener, so it must be dialed via port-forward only.
  string quic_sni = 9;

  // The agent's version.
  string version = 10;
}

message AgentPodInfoSnapshot {
  repeated AgentPodInfo agents = 1;
}

message AgentPodInfoDelta {
  map<string,AgentPodInfo> upserts = 1;
  repeated string removals = 2;
}

message AgentConfigRequest {
  SessionInfo session = 1;
  string name = 2;
  string namespace = 3;
}

message AgentConfigResponse {
  bytes data = 1;
}

message TunnelMetrics {
  string client_session_id = 1;

  // Number of bytes sent from the client to the traffic-agent.
  uint64 ingress_bytes = 2;

  // Number of bytes sent from traffic-agent to the client.
  uint64 egress_bytes = 3;
}

message KnownWorkloadKinds {
  repeated WorkloadInfo.Kind kinds = 1;
}

message ServicePort {
  string name = 1;
  int32 port = 2;
  string target_port = 3;
}

// RouteAssociation describes a route object (currently always an Ingress
// in the service's own namespace) that routes traffic to one of the ports
// of the service it is associated with.
message RouteAssociation {
  string type = 1;
  string name = 2;
  repeated string hosts = 3;
  repeated string paths = 4;
  bool tls = 5;

  // The service port that this route targets.
  string port_name = 6;
  int32 port = 7;

  // Load-balancer addresses (IPs or hostnames) of the route object, used
  // to reach the route when it declares no hosts.
  repeated string addresses = 8;
}

// ServiceAssociation describes a service in the workload's namespace whose
// selector matches the workload's pods, together with the routes that
// target that service.
message ServiceAssociation {
  string name = 1;
  repeated ServicePort ports = 2;
  repeated RouteAssociation routes = 3;
}

// WorkloadInfo contains information about a workload (typically a
// Deployment).
message WorkloadInfo {
  enum Kind {
    UNSPECIFIED = 0;
    DEPLOYMENT = 1;
    REPLICASET = 2;
    STATEFULSET = 3;
    ROLLOUT = 4;
  }

  enum State {
    // The state of this workload is not known.
    UNKNOWN_UNSPECIFIED = 0;

    // Available means the deployment is available, ie. at least the minimum available
    // replicas required are up and running for at least minReadySeconds.
    AVAILABLE = 1;

    // Progressing means the workload is progressing. Progress for a workload is
    // considered when a new replica set is created or adopted, and when new pods scale
    // up or old pods scale down. Progress is not estimated for paused workloads or
    // when progressDeadlineSeconds is not specified.
    PROGRESSING = 2;

    // FAILURE means that one of its pods fails to be created or deleted.
    FAILURE = 3;
  }

  enum AgentState {
    // Workload has never been intercepted, so no agent has been installed.
    NO_AGENT_UNSPECIFIED = 0;

    // An agent has been installed into workload's pods, but it is not currently intercepted.
    INSTALLED   = 1;

    // The workload (or rather its pods) is currently intercepted.
    INTERCEPTED = 2;
  }

  message Intercept {
    // name of intercepting client
    string client = 1;
  }

  Kind kind = 1;
  string name = 2;
  string namespace = 3;
  string uid = 7;
  int32 desired_replicas = 8;
  int32 ready_replicas = 9;
  repeated ServiceAssociation services = 10;
  AgentState agent_state = 4;

  repeated Intercept intercept_clients = 5;

  State state = 6;
}

message WorkloadEvent {
  enum Type {
    ADDED_UNSPECIFIED = 0;
    MODIFIED = 1;
    DELETED = 2;
  }

  Type type = 1;
  WorkloadInfo workload = 2;
}
// WorkloadEventDelta contains the changes made to the subscribed namespace since
// the time given in the timestamp. A watcher can rely on that received deltas are
// consecutive.
message WorkloadEventsDelta {
  // The timestamp from which this delta is computed. Typically
  // equal to the time when the previous delta was sent.
  google.protobuf.Timestamp since = 1;

  repeated WorkloadEvent events = 2;
}

message WorkloadEventsRequest {
  // The session_info identifies the client connection, and hence the
  // namespace for the resulting watcher.
  SessionInfo session_info = 1;

  // The timestamp from which the first delta should be computed. Set to
  // undefined to get a delta that contains everything.
  google.protobuf.Timestamp since = 2;

  // The namespace to watch. Must be one of the namespaces that are
  // managed by the traffic-manager. Defaults to the connected namespace.
  string namespace = 3;
}

message UninstallAgentsRequest {
  // The session_info identifies the client connection, and hence the
  // namespace for the resulting watcher.
  SessionInfo session_info = 1;

  // The agents to install. Empty means all agents in the connected namespace.
  repeated string agents = 2;
}

service Manager {
  // Version returns the version information of the Manager.
  rpc Version(google.protobuf.Empty) returns (VersionInfo2);

  // GetAgentImageFQN returns fully qualified name of the image that is injected into intercepted pods.
  rpc GetAgentImageFQN(google.protobuf.Empty) returns (AgentImageFQN);

  // GetAgentConfig returns the agent configuration for a specific workload.
  rpc GetAgentConfig(AgentConfigRequest) returns (AgentConfigResponse);

  // GetClientConfig returns the config that connected clients should use for this manager.
  rpc GetClientConfig(google.protobuf.Empty) returns (CLIConfig);

  // GetTelepresenceAPI returns information about the TelepresenceAPI server
  rpc GetTelepresenceAPI(google.protobuf.Empty) returns (TelepresenceAPIInfo);

  // ArriveAsClient establishes a session between a client and the Manager.
  rpc ArriveAsClient(ClientInfo) returns (SessionInfo);

  // ReconnectAgent re-establishes a session between an agent and the Manager.
  rpc ReconnectAgent(ReconnectAgentRequest) returns (google.protobuf.Empty);

  // ReconnectClient re-establishes a session between a client and the Manager.
  rpc ReconnectClient(ReconnectClientRequest) returns (google.protobuf.Empty);

  // ArriveAsAgent establishes a session between an agent and the Manager.
  rpc ArriveAsAgent(AgentInfo) returns (SessionInfo);

  // Remain indicates that the session is still valid, and potentially
  // updates the auth token for the session.
  rpc Remain(RemainRequest) returns (google.protobuf.Empty);

  // Depart terminates a session.
  rpc Depart(SessionInfo) returns (google.protobuf.Empty);

  // SetLogLevel will temporarily set the log-level for the traffic-manager and all
  // traffic-agents for a duration that is determined b the request.
  rpc SetLogLevel(LogLevelRequest) returns (google.protobuf.Empty);

  // GetLogs will acquire logs for the various Telepresence components in kubernetes
  // (pending the request) and return them to the caller
  // Deprecated: Will return an empty response
  rpc GetLogs(GetLogsRequest) returns (LogsResponse);

  // WatchAgentPods notifies a client of the set of known Agents from the client
  // connections namespace that the client can connect to when port-forwards are
  // allowed.
  rpc WatchAgentPods(SessionInfo) returns (stream AgentPodInfoSnapshot);

  // WatchAgentPods notifies a client of changes to the set of known Agents from the client
  // connections namespace that the client can connect to when port-forwards are
  // allowed.
  rpc WatchAgentPodsDelta(SessionInfo) returns (stream AgentPodInfoDelta);

  // WatchAgentPodsInNamespacesDelta notifies a client of changes to the set of
  // known Agents from the requested namespaces that the client can connect to
  // when port-forwards are allowed.
  rpc WatchAgentPodsInNamespacesDelta(AgentsRequest) returns (stream AgentPodInfoDelta);

  // WatchAgents notifies a client of the set of known Agents.
  //
  // A session ID is required; if no session ID is given then the call
  // returns immediately, having not delivered any snapshots.
  rpc WatchAgents(SessionInfo) returns (stream AgentInfoSnapshot);

  // WatchAgents notifies a client of changes to the set of known Agents.
  rpc WatchAgentsDelta(SessionInfo) returns (stream AgentInfoDelta);

  // WatchIntercepts notifies a client or agent of the set of intercepts
  // relevant to that client or agent.
  //
  // If a session ID is given, then only intercepts associated with
  // that session are watched.  If no session ID is given, then all
  // intercepts are watched.
  rpc WatchIntercepts(SessionInfo) returns (stream InterceptInfoSnapshot);

  // WatchInterceptsDelta notifies a client or agent of changes in the set of intercepts
  // relevant to that client or agent.
  rpc WatchInterceptsDelta(SessionInfo) returns (stream InterceptInfoDelta);

  // WatchSessionEvents notifies a client of changes to the set of known
  // agent pods in the requested namespaces and to the client's own
  // intercepts, multiplexed onto a single stream. It replaces the
  // combination of WatchAgentsDelta, WatchInterceptsDelta, and
  // WatchAgentPodsInNamespacesDelta for clients that support it.
  rpc WatchSessionEvents(SessionEventsRequest) returns (stream SessionEventsDelta);

  // WatchWorkloads notifies a client of the set of Workloads from the client
  // connection's namespace.
  rpc WatchWorkloads(WorkloadEventsRequest) returns (stream WorkloadEventsDelta);

  // WatchClusterInfo returns information needed when establishing
  // connectivity to the cluster.
  rpc WatchClusterInfo(SessionInfo) returns (stream ClusterInfo);

  // EnsureAgent ensures that an agent is injected to the pods of a workload and
  // returns the agents, sorted by pod name.
  rpc EnsureAgent(EnsureAgentRequest) returns (AgentInfoSnapshot);

  // ReleaseAgent releases the caller's claim on a node-agent previously
  // ensured with node_agent=true in EnsureAgentRequest. The manager reaps
  // the node-agent Job once no live intercept or claim remains. For a
  // sidecar agent (or an unknown claim) it is a no-op.
  rpc ReleaseAgent(ReleaseAgentRequest) returns (google.protobuf.Empty);

  // Request that the traffic-manager makes the preparations necessary to
  // create the given intercept.
  rpc PrepareIntercept(CreateInterceptRequest) returns (PreparedIntercept);

  // CreateIntercept lets a client create an intercept.  It will be
  // created in the "WATING" disposition, and it will remain in that
  // state until the Agent (the app-sidecar) calls ReviewIntercept()
  // to transition it to the "ACTIVE" disposition (or one of the error
  // dispositions).
  rpc CreateIntercept(CreateInterceptRequest) returns (InterceptInfo);

  // RemoveIntercept lets a client remove an intercept.
  rpc RemoveIntercept(RemoveInterceptRequest2) returns (google.protobuf.Empty);

  // GetIntercept gets info from intercept name
  rpc GetIntercept(GetInterceptRequest) returns (InterceptInfo);

  // ReviewIntercept lets an agent approve or reject an intercept by
  // changing the disposition from "WATING" to "ACTIVE" or to an
  // error, and setting a human-readable status message.
  rpc ReviewIntercept(ReviewInterceptRequest) returns (google.protobuf.Empty);

  // GetKnownWorkloadKinds returns the known workload kinds
  // that the manager can handle. This set may include Deployment, StatefulSet, ReplicaSet, Rollout (Argo Rollouts)
  // as configured in the manager's Helm values.
  rpc GetKnownWorkloadKinds(SessionInfo) returns (KnownWorkloadKinds);

  // Lookup performs an LookupIP in the cluster and returns the resultings IPs.
  rpc Lookup(LookupRequest) returns (LookupResponse);

  // LookupDNS performs a DNS lookup in the cluster. If the caller has intercepts
  // active, the lookup will be performed from the intercepted pods.
  rpc LookupDNS(DNSRequest) returns (DNSResponse);

  // WatchLogLevel lets an agent receive log-level updates
  rpc WatchLogLevel(google.protobuf.Empty) returns (stream LogLevelRequest);

  // A Tunnel represents one single connection where the client or
  // traffic-agent represents one end (the client-side) and the
  // traffic-manager represents the other (the server side). The first
  // message that a client sends when the tunnel is established is will
  // always contain the session ID, connection ID, and timeouts used by
  // the dialer endpoints.
  rpc Tunnel(stream TunnelMessage) returns (stream TunnelMessage);

  // GetQuicTunnelEndpoint returns the descriptor for the traffic-manager's QUIC
  // endpoint, including a session-scoped client certificate, so that the caller can
  // dial it directly instead of tunneling over this port-forwarded connection. The
  // returned descriptor has enabled == false when no QUIC endpoint is exposed.
  rpc GetQuicTunnelEndpoint(SessionInfo) returns (QuicTunnelEndpoint);

  // GetSessionCredential returns the session-scoped credential used to authenticate
  // against a traffic-agent's file-sharing and gRPC ports, in both its certificate
  // and bearer-token forms. It is only served to the session's owner.
  rpc GetSessionCredential(SessionInfo) returns (SessionCredential);

  // GetQuicAgentCert mints a QUIC server certificate for the calling agent's
  // own SNI name (quicfwd.AgentSNI(pod UID)), so it can run a QUIC listener
  // behind the forwarder. The caller's session must be an agent session
  // (established via ArriveAsAgent/ReconnectAgent). The returned descriptor
  // has enabled == false when the manager has no QUIC CA.
  rpc GetQuicAgentCert(SessionInfo) returns (QuicAgentCert);

  // WatchQuicBackends notifies the QUIC forwarder of the set of pod IPs
  // (traffic-manager and traffic-agent alike) it may route QUIC traffic to.
  // Unlike the other Watch* RPCs this call carries no SessionInfo: the
  // forwarder has no client session, and the backend set it returns is not
  // scoped to one. The first message is sent immediately on subscribe; a
  // new one follows whenever the backend set changes. Every message is a
  // full QuicBackendSnapshot, not a delta.
  rpc WatchQuicBackends(google.protobuf.Empty) returns (stream QuicBackendSnapshot);

  // ReportMetrics is used by a traffic-agent to report metrics for streams
  // established when clients connect directly to traffic-agents using port-forward.
  rpc ReportMetrics(TunnelMetrics) returns (google.protobuf.Empty);

  // UninstallAgents will uninstall the traffic-agent from the given workloads (or all
  // workloads if the list is empty).
  rpc UninstallAgents(UninstallAgentsRequest) returns (google.protobuf.Empty);
}

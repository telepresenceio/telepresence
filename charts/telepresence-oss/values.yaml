################################################################################
## Deployment Configuration
################################################################################

# The Traffic Manager only support running with one replica at the moment.
# Configuring the replicaCount will be added in future versions of Telepresence

replicaCount: 1

# Common labels applied to all resources created by this chart (Deployment, Service, RBAC, etc.)
labels: {}

# The Telepresence client will try to ensure that the Traffic Manager image is
# up to date and from the right registry. If you are changing the value below,
# ensure that the tag is the same as the client version and that the
# TELEPRESENCE_REGISTRY environment variable is equal to image.repository.
#
# The client will default to ghcr.io/telepresenceio/tel2:{{CLIENT_VERSION}}

image:
  registry: ghcr.io/telepresenceio
  name: tel2
  pullPolicy: IfNotPresent

# apiPort is part of the known-name connect contract: a client dials pod
# traffic-manager-0 on this port directly to establish its session (see
# docs/reference/rbac.md). Overriding it takes clients off that path onto
# the discovery fallback, which requires clientRbac.legacyAccess.
#
# Default: 8081
apiPort: 8081

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# extraEnv, extraVolumes, and extraVolumeMounts add to (never replace) the
# traffic-manager container/pod and, when quicTunnel is enabled, the
# quic-forwarder container/pod. Useful for things like mounting a
# coverage hostPath in test clusters or injecting a sidecar's shared
# volume.
# extraEnv:
#   - name: EXTRA_ENV_EXAMPLE
#     value: "some-value"
# extraVolumes:
#   - name: extra-volume-example
#     emptyDir: {}
# extraVolumeMounts:
#   - name: extra-volume-example
#     mountPath: /var/run/extra-volume-example

################################################################################
## Traffic Manager Service Configuration
################################################################################

service:
  type: ClusterIP

################################################################################
## Traffic Manager Configuration
################################################################################

# The log level of the Traffic Manager.
logLevel: info

# GRPC configuration for the Traffic Manager.
# This is identical to the grpc configuration for local clients.
# See https://www.telepresence.io/docs/latest/reference/config/#grpc for more info
grpc:
  # Max time that the traffic-manager or traffic-agent will keep an idle client connection alive
  connectionTTL: 24h

  # maxReceiveSize is a quantity that configures the maximum message size that the traffic
  # manager will service.
  maxReceiveSize: 4Mi

# security configures the traffic-manager's caller-authentication behavior.
security:
  authentication:
    # mode controls how strictly the traffic-manager enforces caller authentication:
    #
    #  disabled    no token validation at all.
    #  permissive  tokens are validated and the resulting identity is used for
    #              authorization checks and session binding, but no call is ever
    #              rejected for lacking or failing authentication.
    #  enforcing   calls without a valid token are rejected.
    #
    # Default: permissive
    mode: permissive

    # x509 configures client-certificate authentication: an additional,
    # opt-in mechanism for identifying clients whose kubeconfig credentials
    # are a client certificate and therefore never produce a bearer token
    # (see mode above and docs/reference/authentication.md). Enabling it
    # lets enforcing mode accept such clients instead of rejecting them.
    x509:
      # enabled turns on the traffic-manager's auth-only TLS listener and,
      # since the manager needs to read the cluster's client CA to verify
      # presented certificates, makes the chart create a RoleBinding in
      # kube-system to the stock extension-apiserver-authentication-reader
      # Role. This only has an effect when mode above is "enforcing" --
      # x509 client-certificate authentication is active whenever mode is
      # "enforcing", unless this is set to false. It has no effect under
      # any other mode.
      #
      # Default: true
      enabled: true

      # port is the container port the auth-only TLS listener binds to.
      # Default: 8083
      port: 8083

  authorization:
    # gate controls which grant satisfies the traffic-manager's authorization
    # review at connect and attach time:
    #
    #  portforward   the caller must hold the pods/portforward grant against
    #                the target (today's proxy).
    #  telepresence  the caller must hold the corresponding telepresence.io
    #                grant (connections to connect, attachments to attach).
    #  any           either grant satisfies the review.
    #
    # The chart renders client Roles to match this setting.
    #
    # Default: any
    gate: any

# podCIDRStrategy controls what strategy the traffic-manager will use for finding out what
# CIDRs the cluster is using for its pods. Valid values are:
#
#  nodePodCIDRs extract CIDRs from the podCIDR and podCIDRs field of the Node Spec.
#  coverPodIPs  extract IPs from the podIP and podIPs field of the Pod Status and compute the CIDRs needed to cover those IPs.
#  environment  use CIDRs listed in the space separated POD_CIDRS environment variable verbatim.
#  auto         first try nodePodCIDRs and if that fails, tru coverPodIPs
#
# Default: auto
podCIDRStrategy: auto

# maxNamespaceSpecificWatchers configures the threshold for when the traffic-manager switches from using one set of
# watchers for each managed namespace to using cluster-wide watchers. This threshold only applies when using a
# namespaceSelector, and only when the traffic-manager is permitted to list the cluster's namespaces.
maxNamespaceSpecificWatchers: 10

managerRbac:
  # Default: true
  create: true

clientRbac:
  # legacyAccess controls the mechanical (non-policy) rules the chart
  # renders into client Roles:
  #
  #  true   the connect Role's discovery rules (services get, pods
  #         get/list) and unscoped pods/portforward create, plus the
  #         per-namespace/cluster-scope Roles' legacy diagnostic grants
  #         (pods get/list, pods/log get, namespaces get/list/watch) --
  #         everything a pre-2.33 client needs to resolve the
  #         traffic-manager Service to a pod and gather logs directly.
  #  false  the connect Role's single pods/portforward rule, scoped to
  #         the StatefulSet's known pod name, and no legacy diagnostic
  #         grants.
  #
  # Only pre-2.33 clients, or an install that overrides apiPort's
  # default (see apiPort below), need the legacy grants. Default flips
  # to false two minor releases after 2.32, and the toggle -- along with
  # the rules it guards and the Deployment-to-StatefulSet migration hook
  # -- is removed four minors after 2.32. Both changes get release-note
  # entries.
  #
  # Default: true
  legacyAccess: true

timeouts:
  # The duration the traffic manager should wait for an agent to arrive (i.e., to be registered in the traffic manager's state)
  # Default: 30s
  agentArrival: 30s

# logStreaming bounds the traffic-manager's StreamLogs RPC, which
# `telepresence gather-logs` uses to fetch manager and agent logs without
# direct pods/log access. Raise these for installations that need larger or
# longer-running log collection.
logStreaming:
  # chunkSize is a quantity bounding the size of each streamed log chunk.
  # Default: 64Ki
  chunkSize: 64Ki

  # podConcurrency is the maximum number of pods a single StreamLogs request
  # reads from concurrently.
  # Default: 4
  podConcurrency: 4

  # podByteLimit is a quantity capping the total bytes streamed per pod
  # within a single StreamLogs request.
  # Default: 10Mi
  podByteLimit: 10Mi

  # deadline bounds the total duration of a single StreamLogs request.
  # Default: 5m
  deadline: 5m

################################################################################
## Agent Injector Configuration
################################################################################
agentInjector:
  enabled: true
  name: agent-injector
  secret:
    name: mutator-webhook-tls
  certificate:
     # The method used by the agent-injector to access the generated secret.
    # Possible options: watch or mount
    #
    # Default watch
    accessMethod: watch

    # The method used to generate the TLS certificate for the agent-injector.
    #
    # Possible options: helm, supplied, or certmanager.
    #
    # If set to `supplied`, ensure your Secret is in the same namespace as the traffic-manager,
    # and that `.agentInjector.secret.name` is set to its name.
    # See the Secret in `agentInjectorWebhook.yaml` for the expected structure of the data.
    # NOTE: If the Secret values update, the helm chart MUST be re-applied to ensure the
    # MutatingWebhookConfiguration uses the new values.
    #
    # Default: helm
    method: helm

    # The certmanager configuration block
    #
    certmanager:
      commonName: agent-injector
      duration: 2160h0m0s
      issuerRef:
        name: telepresence
        kind: Issuer

    # altNames adds extra Subject Alternative Names to the webhook certificate, in addition to the
    # default in-cluster Service names. Set this when the API server reaches the webhook by a custom
    # hostname or URL (see agentInjector.webhook.url), such as a node's DNS name. Applies to both the
    # helm-generated and the cert-manager certificate.
    altNames: []

  # service configures the Service that fronts the agent-injector webhook. By default it inherits the
  # chart-wide service.type (ClusterIP). On clusters where the API server cannot reach an in-cluster
  # Service - for example EKS with Calico, where the control plane is outside the pod network - set
  # type to NodePort (and optionally pin nodePort) and point the webhook at it with
  # agentInjector.webhook.url.
  service:
    # type overrides the chart-wide service.type for the agent-injector Service only. Empty inherits
    # service.type.
    type: ""
    # port is the port the Service listens on. Empty inherits agentInjector.webhook.port. Set this
    # to expose the webhook on a different external port (e.g. 443 for a LoadBalancer) while the
    # traffic-manager container keeps binding the unprivileged webhook.port. The Service always
    # targets the manager's https container port regardless of this value.
    port: ""
    # nodePort pins the node port when type is NodePort. Empty lets Kubernetes allocate one.
    nodePort: ""

  injectPolicy: OnDemand
  mutationAware: true
  webhook:
    name: agent-injector-webhook
    admissionReviewVersions: ["v1"]
    servicePath: /traffic-agent
    port: 8443
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    sideEffects: None
    timeoutSeconds: 5
    # url, when set, makes the API server reach the webhook at this URL instead of through the
    # in-cluster Service. Use together with agentInjector.service (NodePort/LoadBalancer) and
    # agentInjector.certificate.altNames when the API server cannot reach the cluster Service.
    # Example: https://<node-dns-name>:32666/traffic-agent
    url: ""
    # Optional objectSelector to limit which pods the mutating webhook applies to.
    # objectSelector: {}

################################################################################
## Telepresence traffic-agent configuration
################################################################################
agent:
  port: 9900
  enableH2cProbing: true
  mountPolicies:
    "/tmp": Local
  image:
    pullPolicy: IfNotPresent
  initContainer:
    enabled: true
  # Settings for cooperating with a service mesh present in the pod.
  # serviceMesh:
  #   # Subnets for which outbound connections made by the traffic-agent must pass
  #   # through the service-mesh proxy instead of bypassing it. Set this to the
  #   # mesh's virtual address range for external services, e.g. Istio's
  #   # ServiceEntry auto-allocation range:
  #   dialSubnets:
  #     - 240.240.0.0/16

################################################################################
## Telepresence API Server Configuration
################################################################################
telepresenceAPI: {}
  # The port on agent's localhost where the API service can be found
  # Default: 0
  # port: 0

################################################################################
## Prometheus Server Configuration
################################################################################
prometheus: {}
  # Set this port number to enable a prometheus metrics http server for the
  # traffic manager
  # Default: 0
  # port: 0
  # dropClientLabel: false

################################################################################
## QUIC Tunnel Configuration
################################################################################
# quicTunnel controls the opt-in QUIC endpoint that the traffic-manager can
# expose so that clients able to reach it upgrade tunneled connections from
# the port-forwarded gRPC transport, removing head-of-line blocking between
# flows. The port-forwarded transport remains the default and the fallback
# when this is disabled or unreachable. Setting quicTunnel.enabled=true alone
# is enough on any cluster whose quic Service type the traffic-manager can
# observe: it discovers the reachable address(es) itself (a LoadBalancer
# Service's assigned ingress, or a NodePort Service's node addresses) and
# advertises them to clients, no further configuration required.
quicTunnel:
  enabled: false
  # UDP port the traffic-manager's QUIC listener binds to. Chosen clear of
  # the other ports this chart uses: apiPort (8081, TCP gRPC),
  # agentInjector.webhook.port (8443, TCP), agent.port (9900, TCP), and
  # prometheus.port (opt-in, TCP).
  port: 7778
  # Externally reachable host or IP advertised to clients, overriding
  # discovery entirely. Leave empty to let the traffic-manager discover the
  # address itself from the quic Service below (the common case). Set this
  # explicitly for topologies the traffic-manager cannot see: a NAT or proxy
  # in front of the LoadBalancer, port remapping, a DNS name that only
  # resolves on the developer's VPN, or a NodePort Service in a
  # namespace-scoped install (which lacks the Node read access discovery
  # needs -- see traffic-manager.namespaced in the reference docs).
  externalHost: ""
  # Advertised UDP port when it differs from the Service port (0 = same).
  # Only meaningful together with externalHost; discovery always uses the
  # Service's own port.
  externalPort: 0
  # UDP port a traffic-agent's own QUIC listener binds to (sidecar and
  # node-agent alike). Delivered to agents only when quicTunnel.enabled is
  # true. A sidecar agent shares its pod's network namespace with the
  # application container, so it needs a port of its own, distinct from the
  # traffic-manager's quicTunnel.port above.
  agentPort: 7787
  service:
    # Whether to create a Service for the QUIC endpoint.
    create: true
    type: LoadBalancer
    # nodePort pins the node port when type is NodePort. 0 lets Kubernetes allocate one.
    nodePort: 0
    annotations: {}
  # The forwarder is the stateless QUIC packet router (the "quic-forwarder"
  # tel2 subcommand) that owns the UDP entry point above and routes packets,
  # by SNI and then by connection ID, to the traffic-manager and
  # traffic-agents. It never terminates TLS and needs no Kubernetes API
  # access of its own -- the traffic-manager's existing RBAC covers the
  # backend allowlist it consumes over gRPC. Only deployed when
  # quicTunnel.enabled is true.
  forwarder:
    # Additional labels to add to the quic-forwarder pod.
    podLabels: {}
    # Number of quic-forwarder replicas. The forwarder keeps no state that
    # matters across a restart, so this can be scaled freely without any
    # coordination between replicas.
    replicas: 1
    # Resource requests and limits for the quic-forwarder container. A CPU
    # request is set so autoscalers with a minimum allocation (e.g. GKE
    # Autopilot, which otherwise floors an unset request at ~250m and
    # throttles the data plane) give it enough to actually forward traffic.
    # No CPU limit is set deliberately: throttling a packet relay under load
    # is worse than letting it contend for spare CPU on the node.
    resources:
      requests:
        cpu: 500m
        memory: 128Mi
      limits:
        memory: 512Mi

################################################################################
## External Endpoint Configuration
################################################################################
# externalEndpoint controls the opt-in external TLS gRPC listener that lets a
# client connect without ever contacting the Kubernetes API server. Publishing
# it requires security.authentication.mode: enforcing -- in permissive or
# disabled mode the listener would have no access control -- and exactly one
# of tls.secretName / tls.certManager.enabled, both enforced at chart render.
# Publishing it also drops the pods/portforward rule from the rendered
# clientRbac connect Role -- external clients never port-forward -- unless
# the authorization gate is "portforward", where possession of that grant
# is itself the connect policy.
externalEndpoint:
  enabled: false

  # port is the container port the external TLS listener binds to. 8444
  # avoids colliding with the agent-injector webhook's 8443 container port.
  # Default: 8444
  port: 8444

  # service configures the Service that fronts the external listener.
  service:
    # type of the Service. LoadBalancer and NodePort are the typical choices
    # for a listener meant to be reached from outside the cluster; ClusterIP
    # is useful behind a separately managed ingress/gateway.
    type: LoadBalancer
    # port the Service listens on.
    port: 443
    # annotations to add to the Service, e.g. cloud-provider load-balancer
    # settings.
    annotations: {}

  # tls configures the certificate the external listener terminates with.
  # Exactly one of secretName or certManager.enabled must be set: the
  # in-memory QUIC CA is ephemeral by design and cannot anchor an
  # admin-distributed pin, so the external listener requires a certificate
  # backed by persistent Secret material.
  tls:
    # secretName is an existing kubernetes.io/tls Secret, in the
    # traffic-manager's namespace, to terminate the listener with.
    secretName: ""

    # certManager has the chart provision the certificate via cert-manager
    # instead of a pre-existing Secret.
    certManager:
      # enabled turns on a cert-manager Certificate for the external
      # listener, issued into the traffic-manager-external-tls Secret.
      enabled: false

      # dnsNames are the Subject Alternative Names for the issued
      # certificate, e.g. the DNS name clients use to reach the external
      # Service.
      dnsNames: []

      # issuerRef is the cert-manager issuer to request the certificate
      # from, e.g. {name: my-issuer, kind: ClusterIssuer}.
      issuerRef: {}

# Values specific to the helm chart hooks for managing upgrade/deleting
hooks:
  busybox:
    registry: docker.io
    image: busybox
    tag: latest
    imagePullSecrets: []

  curl:
    registry: docker.io
    image: "curlimages/curl"
    tag: 8.1.1
    imagePullSecrets: []
    pullPolicy: IfNotPresent

client:
  # cluster:
  #   # Namespaces delivered to connecting clients as their mapped-namespaces default.
  #   # A client's local --mapped-namespaces flag or config.yml setting overrides it.
  #   mappedNamespaces: []
  dns:
    # Tell client's DNS resolver to never send names with these suffixes to the cluster side resolver
    excludeSuffixes: [".com", ".io", ".net", ".org", ".ru"]

# Controls which workload kinds are recognized by Telepresence
workloads:
  deployments:
    enabled: true
  replicaSets:
    enabled: true
  statefulSets:
    enabled: true
  argoRollouts:
    enabled: false

# Intercept configuration
intercept:
  # Allow global TCP/UDP intercepts. When set to false, only HTTP intercepts
  # with header or path filters are allowed. This prevents users from creating
  # global intercepts that block other users from intercepting the same port.
  allowGlobalIntercepts: true

  # The maximum amount of time an intercept may be held by a client that is unreachable or inactive.
  # Once this timeout is exceeded, the intercept no longer blocks conflicting intercepts and may be
  # automatically removed when another client attempts to create a conflicting intercept.
  inactiveBlockTimeout: 10m

################################################################################
## Anonymous Usage Reporting
################################################################################
# Controls anonymous usage reporting from the traffic-manager. Reports carry
# only an installation UUID (stored in the traffic-manager-install ConfigMap),
# never cluster, namespace, workload, or address data.
usage:
  # enabled controls whether the traffic-manager produces usage reports.
  # When false, the producer is not installed and nothing is buffered or sent.
  enabled: true

  # collectorAddress is the host:port of the gRPC collector. When empty,
  # produced reports are silently discarded — useful for air-gapped clusters.
  collectorAddress: "usg.tada.se:443"

  # insecure controls whether the collector is dialed without TLS. Leave false
  # for any real deployment.
  insecure: false

################################################################################
## Route Controller Configuration
################################################################################
# routeController installs a DaemonSet that watches for Service deletions and
# adds temporary blackhole routes on each node for deleted ClusterIPs, preventing
# routing loops on local clusters (Kind, minikube, k3d, Docker Desktop) where
# deleted service IPs fall through to the node's default route.
routeController:
  # enabled controls the route-controller DaemonSet:
  #   null (default) - auto-enable when image.registry is "local" or starts with "localhost:"
  #   true           - always enable
  #   false          - always disable, even on local clusters
  enabled: ~
  image:
    # registry and pullPolicy default to the traffic-manager image settings when not set
    registry: ""
    name: route-controller
    pullPolicy: ""
  # logLevel defaults to the traffic-manager logLevel when not set
  logLevel: ""
  # serviceCIDRs is a list of service CIDRs (e.g. ["10.96.0.0/12"]) for which the
  # route-controller installs subnet-level blackhole routes at startup. These are
  # overridden by kube-proxy for active services and catch any non-existent IP in
  # the range without waiting for a deletion event.
  # If empty, the controller queries the ServiceCIDR API (k8s >= 1.33) and falls
  # back to per-IP blackhole routes on deletion for older clusters.
  serviceCIDRs: []

################################################################################
## Node Agent Configuration
################################################################################
# nodeAgent controls node-hosted traffic-agent mode: the traffic-manager may
# create node-pinned Jobs that serve intercepts by entering an existing pod's
# namespaces instead of injecting a sidecar.
nodeAgent:
  # enabled turns on node-hosted traffic-agent mode: the traffic-manager may
  # create node-pinned Jobs that serve intercepts by entering an existing
  # pod's namespaces instead of injecting a sidecar. Off by default; it
  # requires that the traffic-manager's own namespace permits the privileged
  # Pod Security Standard, since node-agent Jobs are created there. Enabling
  # this also makes the node-agent the default mode for client attachments,
  # unless client.nodeAgent.enabled is set explicitly.
  enabled: false
  # criSocket is the container-runtime socket path mounted read-only into
  # node-agent pods. When empty (the default), the node's /run directory is
  # mounted read-only instead, and the agent picks the well-known CRI socket
  # beneath it that recognizes the target's containers: containerd, CRI-O,
  # k3s, or cri-dockerd (the docker runtime). Set an explicit path only when
  # the node's runtime listens on a socket the probe doesn't cover.
  criSocket: ""

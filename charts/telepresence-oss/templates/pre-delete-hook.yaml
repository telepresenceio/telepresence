{{- /*
This hook also runs for a node-agent-only install (agentInjector.enabled=
false, nodeAgent.enabled=true): the traffic-manager still needs its
node-agent Jobs reaped on uninstall, and serves /uninstall itself over
plain HTTP in that mode (see the agent-injector Service in service.yaml).
*/}}
{{- if and (not (and .Values.rbac .Values.rbac.only)) (or .Values.agentInjector.enabled .Values.nodeAgent.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: uninstall-agents
  namespace: {{ include "traffic-manager.namespace" $ }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
  annotations:
    {{- /* This is what defines this resource as a hook. Without this line, the job is considered part of the release. */}}
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      name: uninstall-agents
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      {{- include "telepresence.hookPodSpecHead" (dict "root" $ "restartPolicy" "Never") | nindent 6 }}
      containers:
        - name: uninstall-agents
          {{- include "telepresence.hookContainerHead" $ | nindent 10 }}
          {{- if .Values.agentInjector.enabled }}
          volumeMounts:
            - name: secret-volume
              mountPath: /secret
          env:
            - name: CURL_CA_BUNDLE
              value: /secret/ca.crt
          {{- end }}
          {{- include "telepresence.hookResources" $ | nindent 10 }}
          command:
            - sh
            - -c
          args:
            {{- /*
            A node-agent-only install has no agent-injector certificate, so
            its /uninstall server (see ServeNodeAgentUninstall) speaks plain
            HTTP; the injector-enabled webhook server keeps using TLS.
            */}}
            - 'curl --fail --connect-timeout 5 --max-time 60 --request DELETE {{ if .Values.agentInjector.enabled }}https{{ else }}http{{ end }}://{{ .Values.agentInjector.name }}.{{ include "traffic-manager.namespace" $ }}:{{ .Values.agentInjector.service.port | default .Values.agentInjector.webhook.port }}/uninstall || exit 0'
      {{- if .Values.agentInjector.enabled }}
      volumes:
        - name: secret-volume
          secret:
            secretName: {{ .Values.agentInjector.secret.name }}
      {{- end }}
      {{- include "telepresence.hookSchedulingTail" $ | nindent 6 }}
{{- end }}

{{- with .Values }}
{{- if not (and .rbac .rbac.only) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "traffic-manager.name" $ }}
  namespace: {{ include "traffic-manager.namespace" $ }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
spec:
  type: {{ .service.type }}
  clusterIP: None
  ports:
  - name: api
    port: {{ .apiPort }}
    targetPort: api
  selector:
    {{- include "telepresence.selectorLabels" $ | nindent 4 }}
{{- /*
The agent-injector Service is also needed for a node-agent-only install
(agentInjector.enabled=false, nodeAgent.enabled=true): the pre-delete hook
dials it to reach /uninstall, which a plain-HTTP server serves on the same
port in that mode. The traffic-manager container's "https" port (see
deployment.yaml) is unconditional on agentInjector.enabled, so this
Service's targetPort resolves correctly either way.
*/}}
{{- if or .agentInjector.enabled .nodeAgent.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .agentInjector.name }}
  namespace: {{ include "traffic-manager.namespace" $ }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
spec:
{{- $injectorSvcType := .agentInjector.service.type | default .service.type }}
{{- if and .agentInjector.service.nodePort (ne ($injectorSvcType | toString) "NodePort") }}
{{- fail "agentInjector.service.nodePort requires agentInjector.service.type to be NodePort" }}
{{- end }}
  type: {{ $injectorSvcType }}
  ports:
  - name: https
    port: {{ .agentInjector.service.port | default .agentInjector.webhook.port }}
    targetPort: https
    {{- with .agentInjector.service.nodePort }}
    nodePort: {{ . }}
    {{- end }}
  selector:
    {{- include "telepresence.selectorLabels" $ | nindent 4 }}
{{- end }}
{{- if .prometheus.port }} # 0 is false
---
apiVersion: v1
kind: Service
metadata:
  name: telepresence-prometheus
  namespace: {{ include "traffic-manager.namespace" $ }}
  labels:
    {{- include "telepresence.labels" $ | fromYaml | merge (dict "name" "telepresence-prometheus") | toYaml | nindent 4 }}
spec:
  type: {{ .service.type }}
  ports:
  - name: telepresence-prometheus
    port: 80
    targetPort: prometheus
  selector:
    {{- include "telepresence.selectorLabels" $ | nindent 4 }}
{{- end }}
{{- if and .quicTunnel.enabled .quicTunnel.service.create }}
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-manager-quic
  namespace: {{ include "traffic-manager.namespace" $ }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
  {{- with .quicTunnel.service.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if and .quicTunnel.service.nodePort (ne (.quicTunnel.service.type | toString) "NodePort") }}
{{- fail "quicTunnel.service.nodePort requires quicTunnel.service.type to be NodePort" }}
{{- end }}
  type: {{ .quicTunnel.service.type }}
  ports:
  - name: quic
    port: {{ .quicTunnel.port }}
    targetPort: quic
    protocol: UDP
    {{- with .quicTunnel.service.nodePort }}
    nodePort: {{ . }}
    {{- end }}
  selector:
    {{- include "telepresence.selectorLabels" $ | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.kafka.enabled }}
{{- $namespace := include "traffic-manager.namespace" $ }}
{{- $name := "tp-kafka" }}
{{- $roleName := printf "%s-%s" $name $namespace }}
{{- $resourceRoleName := $name }}
{{- $secretName := printf "%s-tls" $name }}
{{- $serviceDNS := printf "%s.%s.svc" $name $namespace }}
{{- $genCA := genCA "tp-kafka-ca" 365 }}
{{- $genCert := genSignedCert $name nil (list (printf "%s.%s" $name $namespace) $serviceDNS) 365 $genCA }}
{{- $secretData := (lookup "v1" "Secret" $namespace $secretName).data }}
{{- $podNamespaceSelector := include "traffic-manager.namespaceSelector" $ | fromJson }}
{{- $podNamespaceExpressions := default (list) $podNamespaceSelector.matchExpressions }}
{{- $_ := set $podNamespaceSelector "matchExpressions" (append $podNamespaceExpressions (dict
      "key" "kubernetes.io/metadata.name" "operator" "NotIn" "values" (list $namespace))) }}
{{- $kafkaLabels := merge (deepCopy (.Values.labels | default dict)) (dict
      "app.kubernetes.io/name" $name
      "app.kubernetes.io/instance" .Release.Name
      "app.kubernetes.io/managed-by" .Release.Service
      "helm.sh/chart" (include "telepresence.chart" $)) }}
{{- if .Chart.AppVersion }}
{{- $kafkaLabels = merge $kafkaLabels (dict "app.kubernetes.io/version" .Chart.AppVersion) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $roleName }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
rules:
  - apiGroups: ["kafka.telepresence.io"]
    resources: ["splits", "routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kafka.telepresence.io"]
    resources: ["splits/status", "routes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $roleName }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $resourceRoleName }}
  namespace: {{ $namespace }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $resourceRoleName }}
  namespace: {{ $namespace }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $resourceRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
type: kubernetes.io/tls
data:
{{- if $secretData }}
  ca.crt: {{ get $secretData "ca.crt" }}
  tls.crt: {{ get $secretData "tls.crt" }}
  tls.key: {{ get $secretData "tls.key" }}
{{- else }}
  ca.crt: {{ $genCA.Cert | b64enc }}
  tls.crt: {{ $genCert.Cert | b64enc }}
  tls.key: {{ $genCert.Key | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
spec:
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
    - name: metrics
      port: 8080
      targetPort: metrics
  selector:
    app.kubernetes.io/name: {{ $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- toYaml $kafkaLabels | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: "{{ coalesce .Values.kafka.image.registry .Values.image.registry }}/{{ .Values.kafka.image.name }}:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ coalesce .Values.kafka.image.pullPolicy .Values.image.pullPolicy }}
          args:
            - controller
            - --webhook-port={{ .Values.kafka.webhook.port }}
            - --leader-election-namespace={{ $namespace }}
            - --provider-namespace={{ $namespace }}
            - --provider-image={{ coalesce .Values.kafka.image.registry .Values.image.registry }}/{{ .Values.kafka.image.name }}:{{ .Chart.AppVersion }}
            - --service-account={{ $name }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: {{ .Values.kafka.webhook.port }}
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: webhook-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ $secretName }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $roleName }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
webhooks:
  - name: split.kafka.telepresence.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      caBundle: {{ if $secretData }}{{ get $secretData "ca.crt" }}{{ else }}{{ $genCA.Cert | b64enc }}{{ end }}
      service:
        name: {{ $name }}
        namespace: {{ $namespace }}
        path: /split
        port: 443
    failurePolicy: {{ .Values.kafka.webhook.failurePolicy }}
    rules:
      - apiGroups: ["kafka.telepresence.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["splits"]
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.kafka.webhook.timeoutSeconds }}
  - name: route.kafka.telepresence.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      caBundle: {{ if $secretData }}{{ get $secretData "ca.crt" }}{{ else }}{{ $genCA.Cert | b64enc }}{{ end }}
      service:
        name: {{ $name }}
        namespace: {{ $namespace }}
        path: /route
        port: 443
    failurePolicy: {{ .Values.kafka.webhook.failurePolicy }}
    rules:
      - apiGroups: ["kafka.telepresence.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["routes"]
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.kafka.webhook.timeoutSeconds }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $roleName }}
  labels:
    {{- toYaml $kafkaLabels | nindent 4 }}
webhooks:
  - name: pods.kafka.telepresence.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      caBundle: {{ if $secretData }}{{ get $secretData "ca.crt" }}{{ else }}{{ $genCA.Cert | b64enc }}{{ end }}
      service:
        name: {{ $name }}
        namespace: {{ $namespace }}
        path: /pod
        port: 443
    failurePolicy: {{ .Values.kafka.webhook.failurePolicy }}
    namespaceSelector:
      {{- toYaml $podNamespaceSelector | nindent 6 }}
    reinvocationPolicy: IfNeeded
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.kafka.webhook.timeoutSeconds }}
{{- end }}

{{- if .Values.kafka.enabled }}
{{- $namespace := include "traffic-manager.namespace" $ }}
{{- $name := "telepresence-kafka" }}
{{- $roleName := printf "%s-%s" $name $namespace }}
{{- $secretName := printf "%s-webhook-tls" $name }}
{{- $serviceDNS := printf "%s.%s.svc" $name $namespace }}
{{- $genCA := genCA "telepresence-kafka-ca" 365 }}
{{- $genCert := genSignedCert $name nil (list (printf "%s.%s" $name $namespace) $serviceDNS) 365 $genCA }}
{{- $secretData := (lookup "v1" "Secret" $namespace $secretName).data }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["kafka.telepresence.io"]
    resources: ["kafkasplits", "kafkaroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kafka.telepresence.io"]
    resources: ["kafkasplits/status", "kafkaroutes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kafka.telepresence.io"]
    resources: ["kafkasplits/finalizers", "kafkaroutes/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
{{- if $secretData }}
  ca.crt: {{ get $secretData "ca.crt" }}
  tls.crt: {{ get $secretData "tls.crt" }}
  tls.key: {{ get $secretData "tls.key" }}
{{- else }}
  ca.crt: {{ $genCA.Cert | b64enc }}
  tls.crt: {{ $genCert.Cert | b64enc }}
  tls.key: {{ $genCert.Key | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
spec:
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
  selector:
    app.kubernetes.io/name: {{ $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "telepresence.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: "{{ coalesce .Values.kafka.image.registry .Values.image.registry }}/{{ .Values.kafka.image.name }}:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ coalesce .Values.kafka.image.pullPolicy .Values.image.pullPolicy }}
          args:
            - controller
            - --webhook-port={{ .Values.kafka.webhook.port }}
            - --leader-election-namespace={{ $namespace }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: {{ .Values.kafka.webhook.port }}
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: webhook-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ $secretName }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $name }}-{{ $namespace }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
webhooks:
  - name: validate-kafkasplit.kafka.telepresence.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      caBundle: {{ if $secretData }}{{ get $secretData "ca.crt" }}{{ else }}{{ $genCA.Cert | b64enc }}{{ end }}
      service:
        name: {{ $name }}
        namespace: {{ $namespace }}
        path: /split
        port: 443
    failurePolicy: {{ .Values.kafka.webhook.failurePolicy }}
    rules:
      - apiGroups: ["kafka.telepresence.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["kafkasplits"]
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.kafka.webhook.timeoutSeconds }}
  - name: validate-kafkaroute.kafka.telepresence.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      caBundle: {{ if $secretData }}{{ get $secretData "ca.crt" }}{{ else }}{{ $genCA.Cert | b64enc }}{{ end }}
      service:
        name: {{ $name }}
        namespace: {{ $namespace }}
        path: /route
        port: 443
    failurePolicy: {{ .Values.kafka.webhook.failurePolicy }}
    rules:
      - apiGroups: ["kafka.telepresence.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["kafkaroutes"]
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.kafka.webhook.timeoutSeconds }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $name }}-pods-{{ $namespace }}
  labels:
    {{- include "telepresence.labels" $ | nindent 4 }}
webhooks:
  - name: pods.kafka.telepresence.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      caBundle: {{ if $secretData }}{{ get $secretData "ca.crt" }}{{ else }}{{ $genCA.Cert | b64enc }}{{ end }}
      service:
        name: {{ $name }}
        namespace: {{ $namespace }}
        path: /pod
        port: 443
    failurePolicy: {{ .Values.kafka.webhook.failurePolicy }}
    namespaceSelector:
      {{- include "traffic-manager.namespaceSelector" $ | fromJson | toYaml | nindent 6 }}
    reinvocationPolicy: IfNeeded
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.kafka.webhook.timeoutSeconds }}
{{- end }}

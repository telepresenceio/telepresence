$schema: https://json-schema.org/draft/2020-12/schema#
$id: https://github.com/telepresenceio/telepresence-oss.schema.json
title: Telepresence Values
description: Values Schema for the Telepresence OSS Helm Chart
type: object
additionalProperties: false
properties:
  affinity:
    description: If specified, the pod's scheduling constraints
    $ref: "#/$defs/affinity"

  agent:
    description: Telepresence traffic-agent configuration
    type: object
    additionalProperties: false
    properties:
      enableConsumptionMetrics:
        description: Enable (the default) or disable the consumption metrics of the traffic-agent. Only valid when the prometheus.port is set.
        type: boolean
      enableH2cProbing:
        description: If enabled, the agent will probe for HTTP2 using clear-text (h2c) support non-TLS ports unless they are configured with appProtocol.
        type: boolean
      initContainer:
        description: Configuration for the init-container that runs before the traffic-agent
        type: object
        additionalProperties: false
        properties:
          enabled:
            description: Enable/Disable the init-container
            type: boolean
      image:
        type: object
        additionalProperties: false
        properties:
          name:
            description: The name of the injected agent image
            type: string
          pullPolicy:
            description: Pull policy in the webhook for the traffic agent image
            $ref: "#/$defs/pullPolicy"
          pullSecrets:
            description: The Secret storing any credentials needed to access the image in a private registry
            type: array
            items:
              $ref: "#/$defs/localObjectReference"
          registry:
            description: The registry for the injected agent image
            type: string
          tag:
            description: Overrides the image tag whose default is the chart appVersion
            type: string
      initResources:
        description: Resource requirements for the init-container
        $ref: "#/$defs/resourceRequirements"
      initSecurityContext:
        description: Security context for the init-container
        $ref: "#/$defs/securityContext"
      logLevel:
        description: Loglevel for the agent, if different from the traffic-manager
        $ref: "#/$defs/logLevel"
      maxIdleTime:
        description: maximum time the agent is idle (no attachments to the workload) before it is cleaned up by the traffic manager
        $ref: "#/$defs/duration"
      mountPolicies:
        description: 'List of volume mount policies. Defaults to {"/tmp" : "Ignore"}'
        type: object
        additionalProperties:
          description: The name or path prefix match of the volume that the policy applies to
          type: string
          enum:
            - Remote
            - RemoteReadOnly
            - Local
            - Ignore
      port:
        description: Port number of the first port that the agent will use
        type: integer
      resources:
        description: Resource requirements for the agent
        $ref: "#/$defs/resourceRequirements"
      securityContext:
        description: Security context for the agent
        $ref: "#/$defs/securityContext"
      serviceMesh:
        description: Settings for cooperating with a service mesh present in the pod
        type: object
        additionalProperties: false
        properties:
          dialSubnets:
            description: Subnets for which outbound connections made by the traffic-agent must pass through the service-mesh proxy instead of bypassing it, e.g. Istio's ServiceEntry auto-allocation range 240.240.0.0/16
            type: array
            items:
              type: string
      watchRetryInterval:
        description: The interval between retries that a watcher uses when the gRPC connection to the traffic manager is lost
        $ref: "#/$defs/duration"

  agentInjector:
    description: Properties for the agent injector service
    type: object
    additionalProperties: false
    properties:
      certificate:
        type: object
        additionalProperties: false
        properties:
          accessMethod:
            description: Method used by the agent injector to access the certificate (watch or mount)
            type: string
            enum:
              - watch
              - mount
          certmanager:
            type: object
            additionalProperties: false
            properties:
              commonName:
                description: The common name of the generated Certmanager certificate
                type: string
              duration:
                description: The certificate validity duration
                $ref: "#/$defs/duration"
              issuerRef:
                type: object
                additionalProperties: false
                properties:
                  kind:
                    description: The Issuer kind to use to generate the self signed certificate (Issuer of ClusterIssuer)
                    type: string
                    enum:
                      - Issuer
                      - ClusterIssuer
                  name:
                    description: The Issuer name to use to generate the self signed certificate
                    type: string
          method:
            description: Method used when generating the certificate used for mutating webhook (helm, supplied, or certmanager)
            type: string
            enum:
              - helm
              - supplied
              - certmanager
          regenerate:
            description: Whether the certificate used for the mutating webhook should be regenerated
            type: boolean
          altNames:
            description: Additional Subject Alternative Names (DNS names or IP addresses) to add to the webhook certificate
            type: array
            items:
              type: string
      enabled:
        description: Enable/Disable the agent-injector and its webhook
        type: boolean
      injectPolicy:
        description: Determines when an agent is injected, possible values are OnDemand and WhenEnabled
        type: string
        enum:
          - OnDemand
          - WhenEnabled
      mutationAware:
        description: Include changes to the pod template that are contributed by other injectors. Implies reinvocationPolicy=IfNeeded
        type: boolean
      name:
        description: Name to use with objects associated with the agent-injector
        type: string
      secret:
        type: object
        properties:
          name:
            description: The name of the secret the agent-injector webhook uses for authorization with the kubernetes api will expose
            $ref: "#/$defs/rfc1123Label"
      service:
        type: object
        additionalProperties: false
        properties:
          type:
            description: Type of service for the agent-injector.
            type: string
          port:
            description: Port the agent-injector Service listens on. Empty inherits agentInjector.webhook.port.
            anyOf:
              - type: string
                const: ""
              - type: integer
          nodePort:
            description: The node port to expose the agent-injector on. Requires type to be NodePort. Empty lets Kubernetes allocate one.
            anyOf:
              - type: string
                const: ""
              - type: integer
      webhook:
        type: object
        additionalProperties: false
        properties:
          admissionReviewVersions:
            description: List of supported admissionReviewVersions
            type: array
            items:
              type: string
          failurePolicy:
            description: Action to take on unexpected failure or timeout of webhook.
            type: string
            enum:
              - Fail
              - Ignore
          name:
            description: The name of the agent-injector webhook
            type: string
          objectSelector:
            description: Optional label selector to limit which pods the mutating webhook applies to
            $ref: "#/$defs/labelSelector"
          port:
            description: Port for the service that provides the admission webhook
            type: integer
          reinvocationPolicy:
            description: Specify if the webhook may be called again after the initial webhook call. Possible values are Never and IfNeeded
            type: string
            enum:
              - IfNeeded
              - Never
          servicePath:
            description: Path to the service that provides the admission webhook
            type: string
          sideEffects:
            description: Any side effects the admission webhook makes outside of AdmissionReview
            type: string
            enum:
              - None
              - NoneOnDryRun
              - Some
              - Unknown
          timeoutSeconds:
            description: Timeout of the admission webhook
            type: integer
          url:
            description: External URL the API server uses to reach the webhook, instead of the in-cluster service
            type: string

  apiPort:
    description: >-
      The port used by the Traffic Manager gRPC API. Part of the known-name connect
      contract (clients dial pod traffic-manager-0 on this port directly); overriding it
      requires clientRbac.legacyAccess.
    type: integer

  client:
    type: object
    properties:
      cluster:
        type: object
        properties:
          mappedNamespaces:
            description: >-
              Namespaces the traffic-manager delivers to connecting clients as their
              mapped-namespaces default. A client's local --mapped-namespaces flag or
              config.yml setting overrides it.
            type: array
            items:
              type: string
      connectionTTL:
        description: Deprecated use grpc.connectionTTL
        deprecated: true
        type: string
        $ref: "#/$defs/duration"
      dns:
        type: object
        properties:
          excludeSuffixes:
            description: >-
              Suffixes for which the client DNS resolver will always fail (or fallback in case of the overriding resolver)
              Defaults to [".com", ".io", ".net", ".org", ".ru"]
            type: array
            items:
              type: string
          includeSuffixes:
            description: >-
              Suffixes for which the client DNS resolver will always attempt to do a lookup. Includes have higher priority
              than excludes
            type: array
            items:
              type: string
      intercept:
        type: object
        properties:
          localShortcut:
            description: >-
              Connect local traffic to destinations covered by the client's own intercepts directly to the
              local intercept handler instead of tunneling to the cluster. Defaults to true
            type: boolean
          localShortcutIsGlobal:
            description: >-
              Apply the local shortcut to all intercepts, including those with header or path filters. The
              shortcut is connection based and cannot evaluate filters, so when this is false, traffic to
              filtered intercepts takes the round trip through the cluster so that the filters are honored
              exactly. Defaults to true, on the assumption that filters exist to limit how the intercept
              impacts others, not the developer's own traffic
            type: boolean
      nodeAgent:
        type: object
        properties:
          enabled:
            description: >-
              Cluster-wide default for the client's --node-agent flag: make intercept, wiretap, and ingest use
              node-hosted traffic-agent mode unless overridden by a workstation's local config.yml or the
              --node-agent flag itself. Off by default.
            type: boolean
      routing:
        type: object
        properties:
          allowConflictingSubnets:
            description: Allow the specified subnets to be routed even if they conflict with other routes on the local machine
            type: array
            items:
              type: string
          alsoProxySubnets:
            description: The virtual network interface of connected clients will also proxy these subnets
            type: array
            items:
              type: string
          neverProxySubnets:
            description: The virtual network interface of connected clients never proxy these subnets
            type: array
            items:
              type: string

  clientRbac:
    type: object
    additionalProperties: false
    properties:
      create:
        description: Create RBAC resources for non-admin users with this release
        type: boolean
      legacyAccess:
        description: >-
          Render the legacy discovery and diagnostic grants (services get, pods get/list,
          pods/log get, namespaces get/list/watch) alongside the minimal, name-scoped
          pods/portforward connect rule. Only pre-2.33 clients, or an install that overrides
          apiPort, need them.
        type: boolean
      namespaces:
        description: The namespaces to give users access to. Defaults to Traffic Manager's namespaces (unless dynamic)
        type: array
        items:
          $ref: "#/$defs/rfc1123Label"
      ruleExtras:
        description: If set, run the clientRbac-ruleExtras template to add additional RBAC rules.
        type: boolean
      subjects:
        description: The user accounts to tie the created roles to
        type: array
        items:
          $ref: "#/$defs/subject"

  compatibility:
    description: For testing only. Makes the manager behave like the given older version by returning Unimplemented for newer RPCs.
    type: object
    additionalProperties: false
    properties:
      version:
        description: The traffic-manager version to emulate
        type: string

  externalEndpoint:
    description: >-
      Configuration for the opt-in external TLS gRPC listener that lets a client connect without ever
      contacting the Kubernetes API server. Publishing it requires security.authentication.mode:
      enforcing and exactly one of tls.secretName / tls.certManager.enabled, both enforced at chart
      render.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: Enable the traffic-manager's external TLS gRPC listener.
        type: boolean
      port:
        description: The container port the external TLS listener binds to.
        type: integer
      service:
        description: Configuration for the Service that fronts the external listener.
        type: object
        additionalProperties: false
        properties:
          type:
            description: The type of Service for the external listener.
            type: string
          port:
            description: The port the Service listens on.
            type: integer
          annotations:
            description: Annotations to add to the external Service.
            type: object
      tls:
        description: >-
          The certificate the external listener terminates with. Exactly one of secretName or
          certManager.enabled must be set.
        type: object
        additionalProperties: false
        properties:
          secretName:
            description: An existing kubernetes.io/tls Secret, in the traffic-manager's namespace.
            type: string
          certManager:
            description: Have the chart provision the certificate via cert-manager.
            type: object
            additionalProperties: false
            properties:
              enabled:
                description: >-
                  Provision a cert-manager Certificate for the external listener, issued into the
                  traffic-manager-external-tls Secret.
                type: boolean
              dnsNames:
                description: Subject Alternative Names for the issued certificate.
                type: array
                items:
                  type: string
              issuerRef:
                description: 'The cert-manager issuer to request the certificate from, e.g. {name: my-issuer, kind: ClusterIssuer}.'
                type: object

  extraEnv:
    description: Extra environment variables added to the traffic-manager container
    type: array
    items:
      $ref: "#/$defs/envVar"

  extraVolumeMounts:
    description: Extra volumeMounts added to the traffic-manager container
    type: array
    items:
      $ref: "#/$defs/volumeMount"

  extraVolumes:
    description: Extra volumes added to the traffic-manager pod
    type: array
    items:
      $ref: "#/$defs/volume"

  global:
    type: object
    additionalProperties: true

  grpc:
    type: object
    additionalProperties: false
    properties:
      connectionTTL:
        description: The time that the traffic-manager or traffic-agent will retain a client connection without any sign of life from the workstation
        type: string
        $ref: "#/$defs/duration"
      maxReceiveSize:
        description: maxReceiveSize is a quantity that configures the maximum message size that the traffic manager will service.
        $ref: "#/$defs/quantity"

  hooks:
    type: object
    additionalProperties: false
    properties:
      busybox:
        type: object
        additionalProperties: false
        properties:
          image:
            description: The name of the image to use for busybox
            type: string
          imagePullSecrets:
            description: The Secret storing any credentials needed to access the image in a private registry
            type: array
            items:
              $ref: "#/$defs/localObjectReference"
          pullPolicy:
            description: Pull policy in the webhook for the image
            $ref: "#/$defs/pullPolicy"
          registry:
            description: The registry to download the image from
            type: string
          tag:
            description: Override the version of busybox to be installed
            type: string
      curl:
        type: object
        additionalProperties: false
        properties:
          image:
            description: The name of the image to use for curl
            type: string
          imagePullSecrets:
            description: The Secret storing any credentials needed to access the image in a private registry
            type: array
            items:
              $ref: "#/$defs/localObjectReference"
          pullPolicy:
            description: Pull policy in the webhook for the image
            $ref: "#/$defs/pullPolicy"
          registry:
            description: The registry to download the image from
            type: string
          tag:
            description: Override the version of curl to be installed
            type: string
      podSecurityContext:
        description: The Kubernetes SecurityContext for the chart hooks Pod
        $ref: "#/$defs/podSecurityContext"
      resources:
        description: Define resource requests and limits for the chart hooks
        $ref: "#/$defs/resourceRequirements"
      securityContext:
        description: The Kubernetes SecurityContext for the chart hooks Container
        $ref: "#/$defs/securityContext"

  hostNetwork:
    description: >-
      Sets the spec.template.spec.hostNetwork for the Traffic Manager.
      Set this to true when using Calico on AWS EKS to ensure that the mutating webhook can
      communicate with the traffic manager
    type: boolean

  image:
    type: object
    additionalProperties: false
    properties:
      imagePullSecrets:
        description: The Secret storing any credentials needed to access the image in a private registry
        type: array
        items:
          $ref: "#/$defs/localObjectReference"
      name:
        description: The name of the image to use for the traffic-manager
        type: string
      pullPolicy:
        description: Pull policy in the webhook for the traffic-manager image
        $ref: "#/$defs/pullPolicy"
      registry:
        description: The registry to download the image from
        type: string
      tag:
        description: Overrides the image tag whose default is the chart appVersion
        type: string

  usage:
    type: object
    additionalProperties: false
    description: Anonymous usage reporting configuration.
    properties:
      enabled:
        description: Enable anonymous usage reporting from the traffic-manager.
        type: boolean
      collectorAddress:
        description: The host:port of the gRPC collector. When empty, produced reports are silently discarded.
        type: string
      insecure:
        description: Dial the collector without TLS. Leave false for any real deployment.
        type: boolean

  intercept:
    type: object
    additionalProperties: false
    properties:
      allowGlobalIntercepts:
        description: Allow global TCP/UDP intercepts. When set to false, only HTTP intercepts with header or path filters are allowed. This prevents users from creating global intercepts that block other users from intercepting the same port.
        type: boolean
      environment:
        type: object
        properties:
          excluded:
            description: Environment variables to exclude from the list sent to the client during attachment
            type: array
            items:
              type: string
      inactiveBlockTimeout:
        description: >-
          The maximum amount of time an intercept may be held by a client that is unreachable or inactive. Once this timeout is exceeded, the intercept
          no longer blocks conflicting intercepts and may be automatically removed when another client attempts to create a conflicting intercept.
        $ref: "#/$defs/duration"

  isCI:
    description: isCI can be set to force the traffic-manager namespace to be "ambassador"
    type: boolean

  labels:
    description: Common labels applied to all resources created by this chart
    type: object
    additionalProperties:
      type: string

  livenessProbe:
    description: Define livenessProbe for the traffic-manager
    $ref: "#/$defs/probe"

  logLevel:
    description: Define the logging level of the Traffic Manager
    $ref: "#/$defs/logLevel"

  logStreaming:
    description: Bounds the traffic-manager's StreamLogs RPC, used by `telepresence gather-logs` to fetch manager and agent logs.
    type: object
    additionalProperties: false
    properties:
      chunkSize:
        description: Quantity bounding the size of each streamed log chunk.
        $ref: "#/$defs/quantity"
      podConcurrency:
        description: Maximum number of pods a single StreamLogs request reads from concurrently.
        type: integer
      podByteLimit:
        description: Quantity capping the total bytes streamed per pod within a single StreamLogs request.
        $ref: "#/$defs/quantity"
      deadline:
        description: Duration bounding a single StreamLogs request.
        $ref: "#/$defs/duration"

  managerRbac:
    type: object
    additionalProperties: false
    properties:
      create:
        description: Create RBAC resources for traffic-manager with this release
        type: boolean
      namespaces:
        description: Declares a fixed set of managed namespaces
        deprecated: true
        type: array
        items:
          $ref: "#/$defs/rfc1123Label"

  maxNamespaceSpecificWatchers:
    description: >-
      Threshold controlling when the traffic-manager switches from using watchers for each managed namespace to using
      cluster-wide watchers
    type: integer
    minimum: 0
    maximum: 50

  nameOverride:
    description: Override the default name prefix used when creating RBAC resources
    type: string

  namespaces:
    description: Declares a fixed set of managed namespaces. Mutually exclusive to namespaceSelector
    type: array
    items:
      $ref: "#/$defs/rfc1123Label"

  namespaceSelector:
    description: Declares the managed namespace using matchLabels and matchExpressions. Mutually exclusive to namespaces
    $ref: "#/$defs/labelSelector"

  nodeAgent:
    description: >-
      Configuration for node-hosted traffic-agent mode, where the traffic-manager creates node-pinned Jobs that
      serve intercepts by entering an existing pod's namespaces instead of injecting a sidecar.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: >-
          Enable node-hosted traffic-agent mode. Off by default; it requires that the traffic-manager's own
          namespace permits the privileged Pod Security Standard, since node-agent Jobs are created there.
        type: boolean
      criSocket:
        description: >-
          The container-runtime socket path mounted read-only into node-agent pods. When empty (the default),
          the node's /run directory is mounted read-only instead and the agent picks the well-known CRI socket
          beneath it that recognizes the target's containers: containerd, CRI-O, k3s, or cri-dockerd (the
          docker runtime). Set an explicit path only when the node's runtime listens on a socket the probe
          doesn't cover.
        type: string

  nodeSelector:
    description: Define which Nodes you want to the Traffic Manager to be deployed to.
    $ref: "#/$defs/nodeSelector"

  podAnnotations:
    description: Annotations for the Traffic Manager Pod
    type: object
    additionalProperties:
      type: string

  podCIDRs:
    description: podCIDRs is the verbatim list of CIDRs used when the podCIDRStrategy is set to environment
    type: array
    items:
      type: string

  podCIDRStrategy:
    description: Define the strategy that the traffic-manager uses to discover what CIDRs the cluster uses for pods
    type: string
    enum:
      - auto
      - coverPodIPs
      - environment
      - nodePodCIDRs

  podLabels:
    description: Labels for the Traffic Manager Pod
    type: object
    additionalProperties:
      type: string

  podSecurityContext:
    description: The Kubernetes SecurityContext for the traffic-manager Pod
    $ref: "#/$defs/podSecurityContext"

  priorityClassName:
    description: Name of the existing pod priority class to be used
    type: string

  prometheus:
    type: object
    additionalProperties: false
    properties:
      port:
        description: Set this port number to enable a prometheus metrics http server for the traffic manager
        type: integer
      dropClientLabel:
        description: optionally drop the client label from prometheus metrics for GDPR personal data compliance
        type: boolean

  quicTunnel:
    description: >-
      Configuration for the opt-in QUIC tunnel endpoint. When enabled, the traffic-manager exposes a UDP QUIC
      listener that clients upgrade to when reachable; the port-forwarded gRPC transport remains the default
      and the fallback.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: Enable the traffic-manager's QUIC tunnel listener.
        type: boolean
      port:
        description: UDP port the traffic-manager's QUIC listener binds to.
        type: integer
      externalHost:
        description: >-
          Externally reachable host or IP advertised to clients. The QUIC endpoint is not advertised until
          this is set (e.g. to the LoadBalancer address of the quic Service).
        type: string
      externalPort:
        description: Advertised UDP port when it differs from the Service port (0 = same).
        type: integer
      agentPort:
        description: >-
          UDP port a traffic-agent's own QUIC listener binds to (sidecar and node-agent alike). Delivered to
          agents only when quicTunnel.enabled is true.
        type: integer
      service:
        description: Configuration for the Service that fronts the QUIC endpoint.
        type: object
        additionalProperties: false
        properties:
          create:
            description: Whether to create a Service for the QUIC endpoint.
            type: boolean
          type:
            description: The type of Service for the QUIC endpoint.
            type: string
          nodePort:
            description: >-
              Fixed node port for the QUIC Service when quicTunnel.service.type is NodePort. 0 lets
              Kubernetes allocate one.
            type: integer
          annotations:
            description: Annotations to add to the QUIC Service.
            type: object
      forwarder:
        description: >-
          Configuration for the quic-forwarder Deployment, the stateless QUIC packet router that fronts the
          QUIC tunnel endpoint. Only deployed when quicTunnel.enabled is true.
        type: object
        additionalProperties: false
        properties:
          podLabels:
            description: Labels to add to the quic-forwarder Pod.
            type: object
            additionalProperties:
              type: string
          replicas:
            description: >-
              Number of quic-forwarder replicas. The forwarder keeps no state that matters across a restart,
              so this can be scaled freely.
            type: integer
          resources:
            description: Resource requests and limits for the quic-forwarder container.
            $ref: "#/$defs/resourceRequirements"

  rbac:
    type: object
    additionalProperties: false
    properties:
      only:
        description: Only create the RBAC resources and omit the traffic-manger
        type: boolean

  readinessProbe:
    description: Define readinessProbe for the Traffic Manger.
    $ref: "#/$defs/probe"

  replicaCount:
    description: Number or replicas for the traffic-manager. The Traffic Manager only support running with one replica at the moment.
    const: 1

  routeController:
    description: >-
      Configuration for the route-controller DaemonSet that installs blackhole routes for deleted service ClusterIPs
      to prevent routing loops on local clusters.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: >-
          Enable or disable the route-controller DaemonSet. When null (the default), the
          route-controller is automatically enabled for local clusters, detected by
          image.registry being "local" or starting with "localhost:". Set to true to
          force-enable or false to force-disable regardless of registry.
        anyOf:
          - type: "null"
          - type: boolean
      image:
        type: object
        additionalProperties: false
        properties:
          name:
            description: The name of the route-controller image
            type: string
          pullPolicy:
            description: Pull policy for the route-controller image. Empty string inherits from image.pullPolicy.
            anyOf:
              - type: string
                const: ""
              - $ref: "#/$defs/pullPolicy"
          registry:
            description: The registry for the route-controller image
            type: string
      logLevel:
        description: Log level for the route-controller. Empty string inherits from logLevel.
        anyOf:
          - type: string
            const: ""
          - $ref: "#/$defs/logLevel"
      serviceCIDRs:
        description: >-
          Service CIDRs for which subnet-level blackhole routes are installed at startup.
          If empty, the controller queries the ServiceCIDR API (k8s >= 1.33) automatically.
          For older clusters, set this explicitly (e.g. ["10.96.0.0/12"]).
        type: array
        items:
          type: string

  resources:
    description: Define resource requests and limits for the Traffic Manger
    $ref: "#/$defs/resourceRequirements"

  schedulerName:
    description: Specify a scheduler for Traffic Manager Pod and hooks Pod
    type: string

  security:
    description: Security-related configuration of the traffic-manager
    type: object
    additionalProperties: false
    properties:
      authentication:
        description: How the traffic-manager authenticates and authorizes its callers
        type: object
        additionalProperties: false
        properties:
          mode:
            description: >-
              disabled performs no token validation, permissive (the default) validates
              tokens and logs authorization decisions without rejecting any call, and
              enforcing rejects unauthenticated or unauthorized calls.
            type: string
            enum: ["disabled", "permissive", "enforcing"]
          x509:
            description: >-
              Client-certificate authentication: an additional, opt-in mechanism for
              identifying clients whose kubeconfig credentials are a client certificate
              and therefore never produce a bearer token.
            type: object
            additionalProperties: false
            properties:
              enabled:
                description: >-
                  Enable the traffic-manager's auth-only TLS listener. Also makes the
                  chart create a RoleBinding in kube-system to the stock
                  extension-apiserver-authentication-reader Role, needed to read the
                  cluster's client CA. Only takes effect when
                  security.authentication.mode is "enforcing"; defaults to true, so
                  set this to false to opt out. Has no effect under any other mode.
                type: boolean
              port:
                description: The container port the auth-only TLS listener binds to.
                type: integer
      authorization:
        description: >-
          Which grant satisfies the traffic-manager's authorization review at
          connect and attach time. The chart renders client Roles to match.
        type: object
        additionalProperties: false
        properties:
          gate:
            description: >-
              portforward requires the pods/portforward grant (today's proxy),
              telepresence requires the corresponding telepresence.io grant,
              and any (the default) accepts either.
            type: string
            enum: ["portforward", "telepresence", "any"]

  securityContext:
    description: The Kubernetes SecurityContext for the traffic-manager container
    $ref: "#/$defs/securityContext"

  service:
    type: object
    additionalProperties: false
    properties:
      type:
        description: The type of service for the traffic-manager
        type: string

  startupProbe:
    description: Define startupProbe for the Traffic Manger.
    $ref: "#/$defs/probe"

  telepresenceAPI:
    type: object
    additionalProperties: false
    properties:
      port:
        description: The port on agent's localhost where the Telepresence API server can be found
        type: integer

  timeouts:
    type: object
    additionalProperties: false
    properties:
      agentArrival:
        description: The time that the traffic-manager will wait for the traffic-agent to arrive
        $ref: "#/$defs/duration"

  tolerations:
    description: Define tolerations for the Traffic Manager to ignore Node taints
    type: array
    items:
      $ref: "#/$defs/toleration"

  workloads:
    type: object
    additionalProperties: false
    properties:
      argoRollouts:
        type: object
        additionalProperties: false
        properties:
          enabled:
            description: Enable/Disable the argo-rollouts integration
            type: boolean
      deployments:
        type: object
        additionalProperties: false
        properties:
          enabled:
            description: Enable/Disable the support for Deployments
            type: boolean
      replicaSets:
        type: object
        additionalProperties: false
        properties:
          enabled:
            description: Enable/Disable the support for ReplicaSets
            type: boolean
      statefulSets:
        type: object
        additionalProperties: false
        properties:
          enabled:
            description: Enable/Disable the support for StatefulSets
            type: boolean

$defs:
  duration:
    type: string
    pattern: "^[+-]?(\\d+(\\.\\d+)?(h|m|s|ms|us|µs))+"
  rfc1123Label:
    description: RFC 1123 label name
    type: string
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  logLevel:
    type: string
    enum:
      - error
      - warning
      - warn
      - info
      - debug
      - trace
  pullPolicy:
    type: string
    enum:
    - Always
    - Never
    - IfNotPresent
  affinity:
    $ref: "#/definitions/io.k8s.api.core.v1.Affinity"
  labelSelector:
    $ref: "#/definitions/io.k8s.apimachinery.pkg.apis.meta.v1.LabelSelector"
  localObjectReference:
    $ref: "#/definitions/io.k8s.api.core.v1.LocalObjectReference"
  nodeSelector:
    type: object
    additionalProperties:
      type: string
  resourceRequirements:
    $ref: "#/definitions/io.k8s.api.core.v1.ResourceRequirements"
  podSecurityContext:
    $ref: "#/definitions/io.k8s.api.core.v1.PodSecurityContext"
  probe:
    $ref: "#/definitions/io.k8s.api.core.v1.Probe"
  quantity:
    $ref: "#/definitions/io.k8s.apimachinery.pkg.api.resource.Quantity"
  securityContext:
    $ref: "#/definitions/io.k8s.api.core.v1.SecurityContext"
  subject:
    $ref: "#/definitions/io.k8s.api.rbac.v1.Subject"
  toleration:
    $ref: "#/definitions/io.k8s.api.core.v1.Toleration"
  envVar:
    $ref: "#/definitions/io.k8s.api.core.v1.EnvVar"
  volume:
    $ref: "#/definitions/io.k8s.api.core.v1.Volume"
  volumeMount:
    $ref: "#/definitions/io.k8s.api.core.v1.VolumeMount"

---
apiVersion: v1
kind: Service
metadata:
  name: "echo-spring"
spec:
  type: ClusterIP
  selector:
    app: echo-spring
  ports:
    - name: proxied
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "echo-spring"
  labels:
    app: echo-spring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-spring
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
      labels:
        app: echo-spring
    spec:
      containers:
        - name: echo-spring
          image: codelev/echo-spring:latest
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /rest/echo
              port: 9000
            initialDelaySeconds: 8
            periodSeconds: 3
            failureThreshold: 10
          ports:
            - containerPort: 9000
              name: http
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi

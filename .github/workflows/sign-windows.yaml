# Signs the Windows release artifacts with Azure Artifact Signing under the
# Tada AB certificate profile and republishes them to an existing release.
#
# Signing happens before packaging: the two exes are signed, the MSI is
# built from them, then the MSI is signed.
#
# The job is skipped until vars.WINDOWS_SIGNING_ENDPOINT is set.
# workflow_dispatch with upload=false performs a dry run that verifies and
# keeps the signed set as a workflow artifact.
name: Sign Windows release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to sign (e.g. v2.33.0-rc.0)
        required: true
        type: string
      upload:
        description: Replace the release artifacts with the signed ones; false keeps them as a workflow artifact
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign (e.g. v2.33.0-rc.0)
        required: true
        type: string
      upload:
        description: Replace the release artifacts with the signed ones; false keeps them as a workflow artifact
        required: false
        type: boolean
        default: true

jobs:
  sign:
    if: vars.WINDOWS_SIGNING_ENDPOINT != ''
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      TELEPRESENCE_VERSION: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
        name: install dependencies
      - uses: ./.github/actions/install-wix

      - name: Download release artifact
        shell: bash
        run: |
          gh release download ${{ inputs.tag }} \
            -p telepresence-windows-${{ matrix.arch }}.zip \
            -D build-output/unsigned
      - name: Stage unsigned binary
        shell: pwsh
        run: |
          Expand-Archive -Path build-output/unsigned/telepresence-windows-${{ matrix.arch }}.zip -DestinationPath build-output/unsigned/${{ matrix.arch }} -Force
          New-Item -ItemType Directory -Force -Path build-output/bin | Out-Null
          Copy-Item build-output/unsigned/${{ matrix.arch }}/telepresence.exe build-output/bin/telepresence.exe
      - name: Build installer inputs
        shell: bash
        run: make -C build-aux/wix-installer deps ARCH=${{ matrix.arch }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The account and profile names are secrets so the log masks them.
      # wintun.dll is left alone; it carries WireGuard's signature.
      - name: Sign executables
        uses: azure/artifact-signing-action@v1.2.0
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\build-output\bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer
        shell: bash
        run: |
          make -C build-aux/wix-installer msi ARCH=${{ matrix.arch }}
          mkdir -p build-output/release
          cp build-output/msi/MainPackage.msi build-output/release/telepresence-windows-${{ matrix.arch }}.msi
      - name: Sign installer
        uses: azure/artifact-signing-action@v1.2.0
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\build-output\release
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Assemble release artifacts
        shell: pwsh
        run: build-aux/winsign/assemble-release.ps1 -Arch ${{ matrix.arch }}
      - name: Verify signatures
        shell: bash
        run: make verify-signatures
      - name: Upload signed artifacts to the release
        if: ${{ inputs.upload }}
        shell: bash
        run: gh release upload ${{ inputs.tag }} build-output/release/* --clobber
      - name: Keep signed artifacts
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-${{ matrix.arch }}
          path: build-output/release/
          retention-days: 7

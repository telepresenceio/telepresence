name: "Integration Tests"
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read

env:
  TELEPRESENCE_REGISTRY: local

# A new push cancels the still-running jobs of the previous push. The label
# name is part of the group so that a push does not cancel an in-flight
# labeled run of a different kind (e.g. "compatibility test").
concurrency:
  group: "integration-${{ github.event.pull_request.number }}-${{ github.event.label.name || 'push' }}"
  cancel-in-progress: true

# build_and_test runs without a label for non-draft PRs whose head branch is
# in this repository; the "ok to test"/"compatibility test" labels remain the
# gate for PRs from forks. The three jobs below repeat that condition because
# workflow files cannot share expressions.
#
# Required-status-check semantics shape this workflow: a job skipped through
# its if-condition reports conclusion "skipped", which SATISFIES a required
# check. That is intended when preflight reports a docs-only change or a
# prerequisite has failed (the failed prerequisite is itself required, so the
# merge stays blocked), but it must never happen for an unlabeled fork PR --
# which is why build_and_test renders a different job name in that case,
# leaving the required "build_and_test (ubuntu-latest)" context unreported
# and the merge blocked as "expected".
jobs:
  # Gatekeeper for the expensive jobs: removes the triggering label so a
  # maintainer can re-add it, decides whether the change is docs-only, and
  # waits for the other required checks so a DCO or unit-test failure is
  # never followed by a pointless integration run.
  preflight:
    if: >-
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) ||
      github.event.label.name == 'ok to test' ||
      github.event.label.name == 'compatibility test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      docs_only: ${{ steps.skip.outputs.should_skip }}
    steps:
      # For PRs from a fork the GITHUB_TOKEN is read-only and this call
      # fails; continue-on-error keeps that from aborting the job (the
      # maintainer removes the label by hand instead). The label name and PR
      # number are passed via env (not interpolated into the script) to
      # avoid command injection.
      - name: Remove triggering label
        if: github.event.action == 'labeled'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"
      # docs_only=true when every change since the last successful run of
      # this workflow matches paths_ignore; build_and_test is then skipped
      # and its required check is satisfied without a run. When no prior
      # successful run can be found the answer is false, so the fail-safe
      # direction is a full run.
      - name: Check for a docs-only change
        id: skip
        uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: false
          paths_ignore: '["docs/**", "**.md", "CHANGELOG.yml"]'
      # The list is the branch protection's required contexts minus this
      # workflow's own build_and_test; reading it from the API would need
      # admin scope the GITHUB_TOKEN does not have, so it is spelled out
      # here. Keep it in sync with the branch protection settings.
      - name: Wait for the other required checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          required=(
            'DCO'
            'Linux: Verify use of forbidden licenses'
            'unit (ubuntu-latest)'
            'unit (macos-latest)'
            'unit (windows-latest)'
          )
          deadline=$((SECONDS + 2100))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | {name, status, conclusion, started_at, created_at}] | group_by(.name) | map(max_by(.started_at // .created_at))')
            pending=()
            for name in "${required[@]}"; do
              row=$(jq -r --arg n "$name" '.[] | select(.name == $n) | "\(.status)/\(.conclusion)"' <<<"$runs")
              case "$row" in
                completed/success|completed/neutral|completed/skipped) ;;
                completed/*)
                  echo "prerequisite check '$name' concluded: ${row#completed/}"
                  exit 1
                  ;;
                '') pending+=("$name (not reported yet)") ;;
                *) pending+=("$name ($row)") ;;
              esac
            done
            if [ ${#pending[@]} -eq 0 ]; then
              echo "all prerequisite checks green"
              exit 0
            fi
            if [ $SECONDS -ge $deadline ]; then
              printf 'timed out waiting for: %s\n' "${pending[@]}"
              exit 1
            fi
            printf 'waiting for: %s\n' "${pending[@]}"
            sleep 60
          done

  build_and_test:
    needs: preflight
    # A docs-only change skips the run except when the "compatibility test"
    # label asked for a suite that has not run for this content.
    if: >-
      needs.preflight.result == 'success' &&
      (needs.preflight.outputs.docs_only != 'true' || github.event.label.name == 'compatibility test')
    name: >-
      ${{ ((github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) ||
           github.event.label.name == 'ok to test' ||
           github.event.label.name == 'compatibility test')
          && format('build_and_test ({0})', matrix.runners)
          || 'build_and_test (awaiting ok-to-test)' }}
    strategy:
      fail-fast: false
      matrix:
        runners:
          - ubuntu-latest
          # Re-enable when we can run a proper cluster. Colima almost works on macOS but the very limited
          # resources available make the test fail very often. On windows, we'll need WSL2
          # - macos-latest
          # - windows-latest
    runs-on: ${{ matrix.runners }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha }}"
      - name: install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Get Telepresence Version
        id: version
        run: |
          v=$(go run build-aux/genversion/main.go ${{github.run_id}})
          echo "TELEPRESENCE_VERSION=$v" >> "$GITHUB_ENV"
          echo "TELEPRESENCE_SEMVER=${v#v}" >> "$GITHUB_ENV"
      - name: Start minikube
        if: runner.os == 'Linux'
        uses: medyagh/setup-minikube@latest
        with:
          kubernetes-version: v1.33.5
          # The full suite runs against containerd, the runtime of most real
          # clusters (and minikube's default from v1.39). The node-agent's
          # runtime-specific CRI socket detection is covered against the
          # docker runtime by the node_agent_docker_runtime job below.
          container-runtime: containerd
      - name: Build client
        run: make build
      - name: Build images
        run: make client-image tel2-image routecontroller-image
      - name: Load images into minikube
        run: |
          minikube image load ${{env.TELEPRESENCE_REGISTRY}}/telepresence:${{env.TELEPRESENCE_SEMVER}}
          minikube image load ${{env.TELEPRESENCE_REGISTRY}}/tel2:${{env.TELEPRESENCE_SEMVER}}
          minikube image load ${{env.TELEPRESENCE_REGISTRY}}/route-controller:${{env.TELEPRESENCE_SEMVER}}
      - name: Run integration tests
        if: github.event.action != 'labeled' || github.event.label.name == 'ok to test'
        timeout-minutes: 150
        shell: bash
        run: |
          set -ex
          if [[ ${RUNNER_OS} == "Windows" ]]; then
            export PATH="$PATH:/C/Program Files/SSHFS-Win/bin:$HOME/kubectl-plugins"
          fi
          make check-integration-ci
      - name: Compatibility with older manager and agent
        if:  ${{ github.event.label.name == 'compatibility test' }}
        env:
          DEV_MANAGER_VERSION: "2.29.3"
          DEV_MANAGER_REGISTRY: ghcr.io/telepresenceio
        timeout-minutes: 150
        shell: bash
        run: |
          set -ex
          if [[ ${RUNNER_OS} == "Windows" ]]; then
            export PATH="$PATH:/C/Program Files/SSHFS-Win/bin:$HOME/kubectl-plugins"
          fi
          make check-integration-ci
      - name: Compatibility with older client
        if:  ${{ github.event.label.name == 'compatibility test' }}
        env:
          DEV_CLIENT_VERSION: "2.29.3"
          DEV_CLIENT_REGISTRY: ghcr.io/telepresenceio
        timeout-minutes: 150
        shell: bash
        run: |
          set -ex
          if [[ ${RUNNER_OS} == "Windows" ]]; then
            export PATH="$PATH:/C/Program Files/SSHFS-Win/bin:$HOME/kubectl-plugins"
          fi
          make check-integration-ci
      - uses: ./.github/actions/upload-logs
        env:
          LOG_SUFFIX: "${{ runner.os }}-${{ runner.arch }}-${{ matrix.clusters.distribution }}-${{ matrix.clusters.version }}"
        if: ${{ always() }}

  # The node-agent resolves container PIDs through the node's CRI socket, and
  # that path is runtime-specific: a docker-runtime node exposes kubelet's
  # containers only through cri-dockerd, while also running a live containerd
  # whose CRI service knows nothing about them. The build_and_test job runs
  # the full suite against containerd; this job proves the node-agent against
  # the docker runtime with just the node-agent suites. The runtime is pinned
  # rather than left to minikube's default, which flips to containerd in
  # v1.39.
  node_agent_docker_runtime:
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.docs_only != 'true' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ok to test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha }}"
      - name: install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Get Telepresence Version
        run: |
          v=$(go run build-aux/genversion/main.go ${{github.run_id}})
          echo "TELEPRESENCE_VERSION=$v" >> "$GITHUB_ENV"
          echo "TELEPRESENCE_SEMVER=${v#v}" >> "$GITHUB_ENV"
      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          kubernetes-version: v1.33.5
          container-runtime: docker
      - name: Build client
        run: make build
      - name: Build images
        run: make client-image tel2-image routecontroller-image
      - name: Load images into minikube
        run: |
          minikube image load ${{env.TELEPRESENCE_REGISTRY}}/telepresence:${{env.TELEPRESENCE_SEMVER}}
          minikube image load ${{env.TELEPRESENCE_REGISTRY}}/tel2:${{env.TELEPRESENCE_SEMVER}}
          minikube image load ${{env.TELEPRESENCE_REGISTRY}}/route-controller:${{env.TELEPRESENCE_SEMVER}}
      - name: Run node-agent integration tests
        timeout-minutes: 60
        shell: bash
        env:
          TEST_SUITE: '^NodeAgent'
        run: |
          set -ex
          make check-integration-ci
      - uses: ./.github/actions/upload-logs
        env:
          LOG_SUFFIX: "${{ runner.os }}-${{ runner.arch }}-docker-runtime"
        if: ${{ always() }}

  # Runs the new regression_test/ framework (see
  # docs/plans/regression-test-framework/plan.md) side by side with the
  # integration suite, on the same minikube setup build_and_test uses. The
  # manager/agent image is loaded into minikube; the client image is only
  # needed by the host docker daemon, for the docker-mode tests.
  regression:
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.docs_only != 'true' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ok to test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha }}"
      - name: install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Get Telepresence Version
        run: |
          v=$(go run build-aux/genversion/main.go ${{github.run_id}})
          echo "TELEPRESENCE_VERSION=$v" >> "$GITHUB_ENV"
          echo "TELEPRESENCE_SEMVER=${v#v}" >> "$GITHUB_ENV"
      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          kubernetes-version: v1.33.5
          container-runtime: containerd
      - name: Build client
        run: make build
      - name: Build and load images into minikube
        run: make load-images
      - name: Run regression tests
        timeout-minutes: 45
        shell: bash
        env:
          RTEST_REGISTRY: local
        run: |
          set -ex
          make check-regression
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: regression-logs-${{ runner.os }}-${{ runner.arch }}
          path: build-output/rtest/logs/

  # Bidirectional compatibility of the compat-core subset: the labeled tests
  # collectively cover most of the manager.Manager RPC surface (guarded by
  # regression_test/framework/compat's manifest test). The counterpart
  # version is the latest release tag, not a hand-pinned literal.
  regression_compat:
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.docs_only != 'true' &&
      github.event.label.name == 'compatibility test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha }}"
      - name: install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Get Telepresence Version
        run: |
          v=$(go run build-aux/genversion/main.go ${{github.run_id}})
          echo "TELEPRESENCE_VERSION=$v" >> "$GITHUB_ENV"
          echo "TELEPRESENCE_SEMVER=${v#v}" >> "$GITHUB_ENV"
      - name: Determine counterpart version
        run: |
          git fetch --tags --quiet
          c=$(git tag --sort=-v:refname | grep -E '^v2\.[0-9]+\.[0-9]+$' | head -1)
          echo "COMPAT_VERSION=${c#v}" >> "$GITHUB_ENV"
          echo "counterpart version: $c"
      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          kubernetes-version: v1.33.5
          container-runtime: containerd
      - name: Build client
        run: make build
      - name: Build images
        run: make tel2-image client-image
      - name: Load images into minikube
        run: minikube image load ${{env.TELEPRESENCE_REGISTRY}}/tel2:${{env.TELEPRESENCE_SEMVER}}
      - name: Compat-core against the released manager
        timeout-minutes: 30
        shell: bash
        env:
          RTEST_REGISTRY: local
          RTEST_MANAGER_VERSION: ${{ env.COMPAT_VERSION }}
          RTEST_LABELS: compat-core
        run: |
          set -ex
          make check-regression
      - name: Compat-core with the released client
        timeout-minutes: 30
        shell: bash
        env:
          RTEST_REGISTRY: local
          RTEST_CLIENT_VERSION: ${{ env.COMPAT_VERSION }}
          RTEST_LABELS: compat-core
        run: |
          set -ex
          make check-regression
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: regression-compat-logs-${{ runner.os }}-${{ runner.arch }}
          path: build-output/rtest/logs/

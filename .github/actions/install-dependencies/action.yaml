name: "Install dependencies"
description: "Install dependencies required by the runner"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version: stable
    - if: runner.os == 'Linux'
      name: install Linux dependencies
      shell: bash
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu sshfs socat libfuse-dev make jq
        sudo sh -c 'echo user_allow_other >> /etc/fuse.conf'
    - if: runner.os == 'macOS'
      name: install macOS dependencies
      shell: bash
      env:
        HOMEBREW_NO_INSTALL_FROM_API: ""
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: |
        brew untap homebrew/core || :
        brew untap homebrew/cask || :
        # Untrusted runner taps we don't use; drop them to silence brew
        # tap-trust warnings. --force, because the runner image has formulae
        # installed from some of them.
        brew untap --force aws/tap azure/bicep hashicorp/tap || :

        # Remove Python3 symlinks in /usr/local/bin as workaround to brew update issues
        # https://github.com/actions/setup-python/issues/577
        rm /usr/local/bin/2to3* || :
        rm /usr/local/bin/idle3* || :
        rm /usr/local/bin/pydoc* || :
        rm /usr/local/bin/python3* || :

        brew update
        # FUSE-T is a kext-less FUSE implementation (it bridges to a local
        # NFSv4 server), so no kernel extension approval is needed. The
        # tap-trust check runs during brew tap itself - before the tap can
        # possibly be trusted - so run it without the GitHub Actions
        # detection: the log keeps the warning text, the run stays free of
        # annotations, and exit codes are unaffected.
        env -u GITHUB_ACTIONS brew tap macos-fuse-t/cask
        brew trust macos-fuse-t/cask
        brew install fuse-t fuse-t-sshfs
        command -v sshfs

        if [[ ${RUNNER_ARCH} == "ARM64" ]]; then
          brew install jq
        fi
    - if: runner.os == 'Windows'
      name: setup make
      shell: pwsh
      run: |
        # Use make from Git for Windows (pre-installed on runners)
        echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
    - if: runner.os == 'Windows'
      name: download winfsp
      uses: nick-fields/retry/@v4
      with:
        max_attempts: 3
        timeout_minutes: 1
        shell: bash
        command: make winfsp.msi
    - if: runner.os == 'Windows'
      name: download sshfs
      uses: nick-fields/retry/@v4
      with:
        max_attempts: 3
        timeout_minutes: 1
        shell: bash
        command: make sshfs-win.msi
    - if: runner.os == 'Windows'
      name: download sshfs
      uses: nick-fields/retry/@v4
      with:
        max_attempts: 3
        timeout_minutes: 1
        shell: bash
        command: make wintun.dll
    - if: runner.os == 'Windows'
      name: install winfsp and sshfs
      shell: powershell
      run: |
        Start-Process msiexec -Wait -verb runAs -Args "/i build-output\\winfsp.msi /passive /qn /L*V winfsp-install.log"
        Start-Process msiexec -Wait -verb runAs -Args "/i build-output\\sshfs-win.msi /passive /qn /L*V sshfs-win-install.log"

        [Environment]::SetEnvironmentVariable("Path", "C:\\;C:\\Program Files\\SSHFS-Win\\bin;$ENV:Path", "Machine")
